name: Publicar sitio

on:
  push:
    branches:
      - main
      - claude/rutina-negocio-tareas-mwk26e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación por vez; no cancelamos una que ya está subiendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar el sitio
        run: |
          mkdir -p _site
          cp -r rutina _site/rutina
          # La landing queda en la raíz sin duplicar el archivo en el repo.
          cp BBatW_landing.html _site/index.html
          cp BBatW_landing.html _site/BBatW_landing.html
          # Jekyll ignoraría archivos y carpetas que empiezan con guion bajo.
          touch _site/.nojekyll
          ls -R _site

      - name: Habilitar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
