# Sistema de Flor · corre solo en GitHub, sin depender de ninguna conversación.
# Horarios en UTC (Buenos Aires = UTC-3). Cada horario dispara una rutina de sistema/config/jobs.yaml.
name: Sistema AT WORK

on:
  schedule:
    - cron: "30 8 * * 1-6"    # 05:30 clases_de_hoy
    - cron: "28 9 * * *"      # 06:28 hoy_notion
    - cron: "12 10 * * *"     # 07:12 para_enviar
    - cron: "47 10 * * 1-6"   # 07:47 discovery
    - cron: "41 11 * * 1"     # 08:41 lunes_semana
    - cron: "33 12 * * 1,3,5" # 09:33 ciclo_alumnas
    - cron: "47 13 * * *"     # 10:47 feedback
    - cron: "41 16 * * *"     # 13:41 respuestas_flor
    - cron: "52 19 * * 5"     # 16:52 viernes_estado
    - cron: "47 21 * * *"     # 18:47 feedback
    - cron: "41 23 * * *"     # 20:41 respuestas_flor
    - cron: "13 0 * * *"      # 21:13 finanzas
    - cron: "23 2 * * *"      # 23:23 notion_al_dia
    - cron: "5 11-23 * * *"   # cada hora 08–20 enviar_aprobados
    - cron: "5 0,1 * * *"     # 21–22 enviar_aprobados
  workflow_dispatch:
    inputs:
      rutina:
        description: "Rutina a correr ahora (ver sistema/config/jobs.yaml)"
        required: true
        default: feedback

concurrency:
  group: sistema-${{ github.event.schedule || inputs.rutina }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Elegir la rutina
        id: plan
        run: |
          case "${{ github.event.schedule }}" in
            "30 8 * * 1-6")    R=clases_de_hoy ;;
            "28 9 * * *")      R=hoy_notion ;;
            "12 10 * * *")     R=para_enviar ;;
            "47 10 * * 1-6")   R=discovery ;;
            "41 11 * * 1")     R=lunes_semana ;;
            "33 12 * * 1,3,5") R=ciclo_alumnas ;;
            "47 13 * * *"|"47 21 * * *") R=feedback ;;
            "41 16 * * *"|"41 23 * * *") R=respuestas_flor ;;
            "52 19 * * 5")     R=viernes_estado ;;
            "13 0 * * *")      R=finanzas ;;
            "23 2 * * *")      R=notion_al_dia ;;
            "5 11-23 * * *"|"5 0,1 * * *") R=enviar_aprobados ;;
            *)                 R="${{ inputs.rutina }}" ;;
          esac
          echo "rutina=$R" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sistema/requirements.txt
      - run: pip install -r sistema/requirements.txt
      - name: Traer las ramas con instrucciones
        run: git fetch origin claude/peaceful-hamilton-9vczne:refs/remotes/origin/claude/peaceful-hamilton-9vczne || true
      - name: Correr ${{ steps.plan.outputs.rutina }}
        working-directory: sistema
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # MODO PRUEBA mientras BBAW_DRY_RUN no sea "0": se arma todo, pero nada sale hacia alumnas.
          BBAW_DRY_RUN: ${{ vars.BBAW_DRY_RUN || '1' }}
        run: python -m bbaw "${{ steps.plan.outputs.rutina }}"
      - name: Guardar registro y aprendizajes
        if: always()
        run: |
          git config user.name "Sistema AT WORK"
          git config user.email "sistema@breakingbarriers.site"
          git add sistema/registro rutinas/criterio-correccion-log.md 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Registro: ${{ steps.plan.outputs.rutina }}" && git push)
