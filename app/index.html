<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AT WORK · Tu espacio</title>
<meta name="description" content="Tu espacio de AT WORK: tu semana, Flor AI, tus coaches, tu feedback y tu progreso.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#82552E">
<meta name="apple-mobile-web-app-title" content="AT WORK">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/webp" href="../at-work/img/tilde.webp">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,500;0,600;1,500&family=Open+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="root"><p class="cargando">Cargando…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="programa.js"></script>
<script src="datos.js"></script>
<script src="app.js"></script>

<!-- Instalar en el iPhone: aviso que solo aparece en Safari de iPhone/iPad
     cuando la app todavía no está en la pantalla de inicio. -->
<style>
  .instalar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;
    max-width:460px;margin:0 auto;display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 12px;
    background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 8px 28px rgba(46,34,24,.18);font:14px/1.45 var(--body)}
  .instalar img{width:44px;height:44px;border-radius:10px;flex:none}
  .instalar b{display:block;font-family:var(--display);font-size:17px;margin-bottom:2px}
  .instalar p{margin:0}
  .instalar .compartir{display:inline-block;width:15px;height:15px;vertical-align:-2px;color:var(--brand)}
  .instalar button{flex:none;margin:-4px -2px 0 auto;padding:4px 8px;border:0;background:none;
    color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
</style>
<script>
(function () {
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* sin offline, la app anda igual */ });
    });
  }

  var ua = navigator.userAgent;
  var esIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var esSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|GSA/.test(ua);
  var instalada = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if (!esIOS || instalada) return;
  try { if (localStorage.getItem('atwork-instalar-cerrado')) return; } catch (e) {}

  var icono = '<svg class="compartir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  var aviso = document.createElement('div');
  aviso.className = 'instalar';
  aviso.setAttribute('role', 'dialog');
  aviso.setAttribute('aria-label', 'Instalar AT WORK en tu iPhone');
  aviso.innerHTML = '<img src="apple-touch-icon.png" alt="">' +
    '<div><b>Tenla como app en tu iPhone</b><p>' +
    (esSafari
      ? 'Toca ' + icono + ' <strong>Compartir</strong> abajo y elige <strong>“Agregar a inicio”</strong>. Desde ahí se abre directo, sin Safari.'
      : 'Abre este link en <strong>Safari</strong>, toca ' + icono + ' <strong>Compartir</strong> y elige <strong>“Agregar a inicio”</strong>.') +
    '</p></div><button type="button" aria-label="Cerrar">×</button>';
  aviso.querySelector('button').addEventListener('click', function () {
    aviso.remove();
    try { localStorage.setItem('atwork-instalar-cerrado', '1'); } catch (e) {}
  });
  window.addEventListener('load', function () { document.body.appendChild(aviso); });
})();
</script>
</body>
</html>
