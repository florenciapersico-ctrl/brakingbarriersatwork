    cuando: "lunes a sábado 07:47"
    tipo: agente
    instrucciones: [rutinas/discovery-calls.md]
    herramientas: [calendar_events, calendar_update_description, gmail_search, gmail_read_thread, email_flor,
                   notion_query, notion_read_page, notion_update_properties, notion_prepend_note, read_repo_file]

  clases_de_hoy:
    nombre: "📚 Clases de hoy listas"
    cuando: "lunes a sábado 05:30"
    tipo: agente
    instrucciones: ["git:claude/peaceful-hamilton-9vczne:rutinas/clases-de-hoy.md"]
    herramientas: [calendar_events, calendar_update_description, drive_list_folder, drive_read_file,
                   drive_create_doc, gmail_search, gmail_read_thread, email_flor, notion_query, notion_read_page,
                   notion_prepend_note, read_repo_file]

  respuestas_flor:
