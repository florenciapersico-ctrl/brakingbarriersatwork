# Rutinas del sistema de Flor. Cada una:
#   cuando:  horario (hora de Buenos Aires) — lo usa .github/workflows/sistema.yml
#   tipo:    "feedback" / "enviar_aprobados" (circuitos en código) o "agente" (IA con herramientas)
#   instrucciones: archivos con el criterio de Flor (se leen en cada corrida)
#   herramientas: lo ÚNICO que esa rutina puede usar
#
# Para cambiar lo que hace una rutina, se cambia su archivo de instrucciones.

comunes: &comunes
  - rutinas/_reglas-comunes.md
  - git:claude/peaceful-hamilton-9vczne:rutinas/_reglas-comunes.md
  - oferta/oferta-vigente.md

rutinas:
  feedback:
    nombre: "💬 Feedback de alumnas"
    cuando: "todos los días 10:47 y 18:47"
    tipo: feedback

  enviar_aprobados:
    nombre: "✅ Enviar feedback aprobado por Flor"
    cuando: "cada hora de 8 a 22"
    tipo: enviar_aprobados

  hoy_notion:
    nombre: "✅ HOY en Notion"
    cuando: "todos los días 06:28"
    tipo: agente
    instrucciones: [sistema/prompts/hoy-notion.md]
    herramientas: [calendar_events, gmail_search, gmail_read_thread, notion_query, notion_read_page,
                   notion_replace_section, read_repo_file]

  para_enviar:
    nombre: "📬 Correos para enviar hoy"
    cuando: "todos los días 07:12"
    tipo: agente
    instrucciones: [sistema/prompts/para-enviar.md]
    herramientas: [gmail_search, gmail_read_thread, gmail_create_draft_for_flor_to_send, email_flor,
                   notion_query, notion_prepend_note, calendar_events]

  discovery:
