    cuando: "lunes 08:41"
    tipo: agente
    instrucciones: ["git:claude/peaceful-hamilton-9vczne:rutinas/lunes-semana.md"]
    # Único mail que sale a alumnas sin aprobación (autorizado por Flor 29/09 y 19/10): el link de su weekly.
