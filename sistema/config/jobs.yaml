    cuando: "todos los días 21:13"
    tipo: agente
    instrucciones: [sistema/prompts/finanzas.md]
    herramientas: [gmail_search, gmail_read_thread, email_flor, notion_query, notion_create_row,
                   notion_update_properties]

  lunes_semana:
