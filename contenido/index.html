<script>
'use strict';
const POSTS = [{"f":"2026-08-25","tipo":"concientizacion","sub":"Verdadero problema","fmt":"carrusel","eje":"Listening","mecanismo":"Escuchar y procesar para responder son dos demandas distintas","cree":"\"Mi listening todavía no es suficientemente bueno.\"","diagnostico":"Entiendes mientras escuchás. El problema aparece cuando además tienes que procesar la pregunta y armar la respuesta. Son dos demandas simultáneas, no una sola habilidad.","lleva":"Entrenar escuchar → procesar → responder, en vez de consumir más listening.","roadmap":"M2 · Manage the Interaction + M4 · Understand & Be Understood","origen":"Ángulo #1 propuesto por Flor","b":[["SLIDE 1","Entendiste perfectamente toda la reunión. Hasta que te hicieron una pregunta."],["SLIDE 2","Y ahí, de golpe, te perdiste. No de la pregunta: de todo.\n\nSaliste pensando que tu listening todavía no alcanza."],["SLIDE 3","Pero fíjate qué venías haciendo hasta ese segundo.\n\nEscuchabas. Nada más. Tu cabeza tenía un solo trabajo, y lo hacía bien."],["SLIDE 4","Cuando te preguntan algo, esa misma cabeza pasa a tener tres trabajos a la vez:\n\nseguir escuchando lo que dicen,\nprocesar qué te están pidiendo,\ny armar la respuesta en inglés.\n\nY los tres compiten por el mismo espacio."],["SLIDE 5","Por eso sentís que \"dejaste de entender\". No dejaste de entender: te quedaste sin lugar para hacer las tres cosas."],["SLIDE 6","Y acá está el problema de diagnosticarlo como listening: si crees que te falta comprensión, vas a escuchar más podcasts.\n\nEscuchar más entrena la primera de las tres. Las otras dos siguen sin entrenarse."],["SLIDE 7","Lo que hay que entrenar es el paso completo: escuchar, procesar y responder, en ese orden y bajo presión. Con permiso de tomarte dos segundos en el medio.\n\nEsos dos segundos no son debilidad. Son lo que te devuelve el espacio."],["SLIDE 8 · CTA","Si te pasa que entiendes todo hasta que te toca a ti, no es tu listening.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Entendiste perfectamente toda la reunión. Hasta que te hicieron una pregunta.\n\nMientras escuchabas, tu cabeza tenía un solo trabajo. Cuando te preguntan, pasa a tener tres a la vez: seguir escuchando, procesar qué te piden y armar la respuesta.\n\nNo dejaste de entender. Te quedaste sin lugar.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"¿Entiendes toda la reunión hasta que te preguntan a ti?\" Invita a deslizar.","h2":"Si tu diagnóstico es \"me falta listening\", vas a entrenar lo que ya te sale.","dia":"Martes","num":25,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Entiendes mientras escuchás. El problema aparece cuando además tienes que procesar la pregunta y armar la respuesta. Son dos demandas simultáneas, no una sola habilidad.","ancla":"M2 · Manage the Interaction + M4 · Understand & Be Understood  ·  Ángulo #1 propuesto por Flor"},{"f":"2026-08-26","tipo":"diferenciacion","sub":"Opinión picante","fmt":"reel","eje":"Método","mecanismo":"Conversación libre vs entrenamiento deliberado","cree":"\"Necesito hablar más inglés para ganar fluidez.\"","diagnostico":"Hablar una hora por semana no entrena explicar un problema, responder algo inesperado, interrumpir, aclarar ni dar un update. Entrena conversar, que es otra cosa.","lleva":"Entrenamiento deliberado de la situación puntual que necesitas resolver.","roadmap":"M1 · Role Play Method + M2 · Workplace Practice Library","origen":"Ángulo #5 propuesto por Flor","b":[["HOOK · 0-3 s","Practicar conversación no es lo mismo que entrenar para una reunión."],["REHOOK · 4-7 s","Y esto te lo digo porque probablemente llevas años haciendo lo primero, esperando el resultado de lo segundo."],["DESARROLLO","Una hora de conversación por semana. Charlas de tu fin de semana, de tu trabajo en general, de lo que viste. Fluye, te sentís cómoda, sales contenta.\n\nY el martes siguiente, en la reunión, te pasa lo mismo de siempre."],["EL GIRO","Porque conversar y trabajar en inglés no piden lo mismo.\n\nEn una conversación eliges de qué hablar, puedes cambiar de tema, nadie te presiona, y si algo no te sale lo esquivas sin que se note."],["EL DIAGNÓSTICO","En una reunión no eliges el tema, ni el momento, ni las preguntas. Tienes que explicar un problema, sostener una posición, interrumpir con educación, pedir aclaración, dar un update en noventa segundos.\n\nNinguna de esas cosas se entrena conversando."],["AHA","Hablar más inglés te da soltura. No te da las habilidades puntuales que se te caen bajo presión."],["CIERRE · texto en pantalla","Por eso yo no te doy más horas de conversación. Entreno la situación que tienes esta semana.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Practicar conversación no es lo mismo que entrenar para una reunión.\n\nConversando eliges el tema, el momento y qué esquivar. En una reunión no eliges nada: explicas un problema, sostienes una posición, interrumpes, pides aclaración, das un update en noventa segundos.\n\nNinguna de esas cosas se entrena charlando.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"A cámara: \"Llevas años practicando conversación. ¿Cambió algo en tus reuniones?\" Link al reel.","h2":"Cuéntame qué situación puntual se te complica y te digo cómo la entrenaría.","dia":"Miércoles","num":26,"tipoNom":"Diferenciación","fmtNom":"Reel a cámara","tpl":{"nombre":"martes DIFERENCIACION","url":"https://www.canva.com/design?create=true&template=EAHKB4Xyhuc"},"micro":"Hablar una hora por semana no entrena explicar un problema, responder algo inesperado, interrumpir, aclarar ni dar un update. Entrena conversar, que es otra cosa.","ancla":"M1 · Role Play Method + M2 · Workplace Practice Library  ·  Ángulo #5 propuesto por Flor"},{"f":"2026-08-28","tipo":"concientizacion","sub":"Error invisible","fmt":"carrusel","eje":"Visibility Gap","mecanismo":"El mensaje achicado: nadie nota lo que no dijiste","cree":"\"Bueno, por lo menos pude comunicarme.\"","diagnostico":"Sobrevivir la reunión esconde que elegiste, en tiempo real, la versión de tu idea que sí podías decir. Y esa versión dejó afuera el matiz, la objeción y la alternativa.","lleva":"Volver sobre una reunión concreta → identificar qué dejaste afuera → construir ese lenguaje → entrenarlo antes de la próxima.","roadmap":"M1 · Color Method + M2 · Organize and Prioritize Your Message","origen":"Ángulo #6 propuesto por Flor","b":[["SLIDE 1","Tu reunión terminó bien. Pero dijiste el 30% de lo que realmente querías decir."],["SLIDE 2","No te bloqueaste. No te quedaste callada. Participaste, respondiste, la reunión avanzó.\n\nY saliste pensando: bueno, por lo menos pude comunicarme."],["SLIDE 3","Por eso este problema es invisible. Nadie va a notar lo que no dijiste.\n\nNi siquiera ti, hasta que lo piensas de nuevo en el auto."],["SLIDE 4","Lo que pasó no fue que te faltaran palabras.\n\nFue que, en tiempo real, elegiste la versión de tu idea que sí podías decir. La más simple. La más corta. La que no te iba a dejar a mitad de camino."],["SLIDE 5","Esa versión te salvó la reunión. Y también borró el matiz, la objeción que tenías, la alternativa que se te había ocurrido, el riesgo que veías venir.\n\nTodo eso era tu criterio profesional."],["SLIDE 6","Ahí está el costo real. No es que suenes con errores.\n\nEs que la sala escuchó una versión más chica de ti de la que realmente eres."],["SLIDE 7","Y esto no se arregla hablando más. Se arregla al revés: volver sobre una reunión concreta, identificar exactamente qué dejaste afuera, construir ese lenguaje puntual, y entrenarlo antes de la próxima."],["SLIDE 8 · CTA","Mi trabajo no es que hables sin errores. Es que tu inglés muestre todo lo que ya sabes.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Tu reunión terminó bien. Pero dijiste el 30% de lo que realmente querías decir.\n\nNo te bloqueaste. Elegiste, en tiempo real, la versión de tu idea que sí podías decir. Esa versión te salvó la reunión y borró el matiz, la objeción y la alternativa.\n\nEso era tu criterio profesional.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"¿Cuánto de lo que querías decir dijiste en tu última reunión?\" Invita a deslizar.","h2":"Nadie nota lo que no dijiste. Ese es el problema.","dia":"Viernes","num":28,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Sobrevivir la reunión esconde que elegiste, en tiempo real, la versión de tu idea que sí podías decir. Y esa versión dejó afuera el matiz, la objeción y la alternativa.","ancla":"M1 · Color Method + M2 · Organize and Prioritize Your Message  ·  Ángulo #6 propuesto por Flor"},{"f":"2026-08-29","tipo":"concientizacion","sub":"Metodología","fmt":"carrusel","eje":"Método","mecanismo":"Feedback sin retry no alcanza","cree":"\"Si me corrigen, aprendo.\"","diagnostico":"Entender la corrección no cambia lo que sale bajo presión. Sin volver a producir la idea, la próxima vez vuelve a salir la versión vieja.","lleva":"Primera producción → aparece el patrón → feedback → segunda producción → cambia el contexto → retry → aplicación real.","roadmap":"M1 · Role Play Method · situación real → intento → feedback → ajuste → retry","origen":"Roadmap AT WORK","b":[["SLIDE 1","Que te corrijan un error no sirve de mucho si no vuelves a producir la idea."],["SLIDE 2","Y esto suena obvio hasta que miras cómo se enseña inglés casi siempre:\n\nhablas, te corrigen, entiendes la corrección, asientes, y pasan al siguiente punto."],["SLIDE 3","Entendiste. De verdad. En ese momento lo tenías clarísimo.\n\nY el jueves siguiente, en una reunión, salió exactamente igual que antes."],["SLIDE 4","Porque entender una corrección y poder producirla bajo presión son dos cosas distintas.\n\nLa primera pasa en tu cabeza, con tiempo y sin nadie mirando. La segunda tiene que pasar en tiempo real, mientras estás pensando en el contenido."],["SLIDE 5","Por eso el recorrido no termina en el feedback:\n\nprimera producción,\naparece el patrón,\nfeedback,\nsegunda producción,\ncambia el contexto,\nretry,\ny recién ahí, aplicación real."],["SLIDE 6","Fíjate dónde está el trabajo de verdad: después de la corrección.\n\nEl feedback es el punto medio, no el final."],["SLIDE 7","Y cambiar el contexto no es un detalle. Si solo repites la misma frase, aprendiste esa frase.\n\nLo que buscamos es que la estructura sobreviva cuando la situación cambia."],["SLIDE 8 · CTA","Por eso una clase conmigo no termina cuando entiendes. Termina cuando lo volviste a producir.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Que te corrijan un error no sirve de mucho si no vuelves a producir la idea.\n\nEntender una corrección y poder producirla bajo presión son dos cosas distintas. Una pasa en tu cabeza, con tiempo. La otra tiene que pasar en tiempo real.\n\nEl feedback es el punto medio, no el final.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"¿Cuántas veces te corrigieron el mismo error?\" Invita a deslizar.","h2":"Feedback sin retry no alcanza. Ese es el punto.","dia":"Sábado","num":29,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Entender la corrección no cambia lo que sale bajo presión. Sin volver a producir la idea, la próxima vez vuelve a salir la versión vieja.","ancla":"M1 · Role Play Method · situación real → intento → feedback → ajuste → retry  ·  Roadmap AT WORK"},{"f":"2026-08-30","tipo":"transformacion","sub":"Transformación interna","fmt":"reel","eje":"Visibility Gap","mecanismo":"La distancia entre tus dos versiones","cree":"\"En inglés no soy yo.\"","diagnostico":"Esa distancia no se cierra con más gramática. Se cierra cuando tu voz profesional —la que ya tienes en español— empieza a aparecer también ahí.","lleva":"Construir tu versión en inglés, no solo subir tu nivel.","roadmap":"Transformación: de sobrevivir con tu inglés a desenvolverte como lo harías en español","origen":"Manual de Contenido · Transformación interna","b":[["HOOK · 0-3 s","Hay una frase que me dicen casi todas, tarde o temprano: \"en inglés no soy yo\"."],["REHOOK · 4-7 s","Y no están hablando de su nivel. Están hablando de otra cosa."],["DESARROLLO","En español eres directa, tienes humor, sabes cuándo bajar el tono y cuándo sostener. Tienes una manera de estar en una sala.\n\nEn inglés aparece alguien más cuidadosa, más corta, más neutra. Alguien que dice lo necesario y se retira."],["EL DIAGNÓSTICO","Esa distancia no es un problema de gramática. Es que nunca construiste tu versión en inglés.\n\nAprendiste el idioma. No trasladaste quién eres adentro de él."],["AHA","Por eso subir de nivel, sola, no la cierra. Puedes pasar de B1 a B2 y seguir sonando a alguien que no eres.\n\nLo que la cierra es que tu voz profesional —la que ya tienes— empiece a aparecer también ahí."],["CIERRE · texto en pantalla","Sabes exactamente quién eres en español.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Hay una frase que me dicen casi todas: \"en inglés no soy yo\".\n\nNo están hablando de su nivel. En español eres directa, tienes humor, sabes cuándo sostener. En inglés aparece alguien más cuidadosa, más corta, más neutra.\n\nEsa distancia no se cierra con más gramática. Se cierra cuando tu voz profesional empieza a aparecer también ahí.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"A cámara: \"¿Sentís que en inglés no eres ti?\" Link al reel.","h2":"No es tu nivel. Es que todavía no construiste tu versión en inglés.","dia":"Domingo","num":30,"tipoNom":"Transformación y Deseo","fmtNom":"Reel a cámara","tpl":{"nombre":"jueves TRANSFORMACION Y DESEO","url":"https://www.canva.com/design?create=true&template=EAHKB4SjwII"},"micro":"Esa distancia no se cierra con más gramática. Se cierra cuando tu voz profesional —la que ya tienes en español— empieza a aparecer también ahí.","ancla":"Transformación: de sobrevivir con tu inglés a desenvolverte como lo harías en español  ·  Manual de Contenido · Transformación interna"},{"f":"2026-08-31","tipo":"concientizacion","sub":"Verdadero problema","fmt":"carrusel","eje":"Executive Communication","mecanismo":"Carga doble: pensar la estructura y producir el idioma a la vez","cree":"\"Me trabé, entonces me falta inglés.\"","diagnostico":"Intentaste pensar el proceso y construir el inglés al mismo tiempo. Ejecutar algo todos los días no es lo mismo que poder explicarlo: nunca tuviste que ponerlo en orden para alguien que no lo conoce.","lleva":"Un proceso real de tu trabajo → organizarlo → detectar el lenguaje que falta → volver a producirlo sin memorizar un texto.","roadmap":"M2 · Organize and Prioritize Your Message + Workplace Guide: Explaining a Process Clearly","origen":"Clase real del 28/7","b":[["SLIDE 1","Te pidieron que explicaras un proceso que conoces de memoria. Y te trabaste. Saliste pensando que fue tu inglés."],["SLIDE 2","Es la conclusión más lógica. Estabas hablando en inglés y ahí se rompió.\n\nPero fíjate qué estabas haciendo en ese mismo segundo."],["SLIDE 3","Decidir por dónde empezar.\nOrdenar los pasos.\nAcordarte de qué depende de qué.\nY construir las frases en inglés.\n\nTodo junto. Con alguien esperando."],["SLIDE 4","Ese proceso lo ejecutas todas las semanas. Pero ejecutar no es lo mismo que explicar.\n\nCuando lo haces, tu cabeza va saltando entre pasos, corrigiendo sobre la marcha, sin necesidad de que nada quede ordenado por fuera de ti."],["SLIDE 5","Explicarlo te obliga a lo contrario: dónde empieza, qué pasa después, qué depende de qué, qué cambia si algo falla.\n\nEso es una estructura. Y probablemente nunca la armaste, ni en español."],["SLIDE 6","Entonces llega la reunión y tienes dos trabajos a la vez: construir la estructura y producir el idioma.\n\nCuando una de las dos no está resuelta de antes, la otra se cae. Y como estabas hablando en inglés, le echas la culpa al inglés."],["SLIDE 7","La prueba es simple. Si te pidieran explicar ese mismo proceso en español, ahora, a alguien que no sabe nada: ¿te saldría ordenado a la primera?\n\nMuchas veces la respuesta también es no."],["SLIDE 8 · CTA","En AT WORK no practicamos \"explicar procesos\" en general. Agarramos uno real de tu trabajo, lo ordenamos, detectamos qué lenguaje te falta, y lo vuelves a producir hasta que salga claro sin memorizar nada.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Te pidieron que explicaras un proceso que conoces de memoria. Y te trabaste. Saliste pensando que fue tu inglés.\n\nEstabas haciendo dos trabajos a la vez: armar la estructura y producir el idioma. Cuando uno de los dos no está resuelto de antes, el otro se cae.\n\nEjecutar un proceso todos los días no es lo mismo que poder explicarlo.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"¿Te trabaste explicando algo que haces todas las semanas?\" Invita a deslizar.","h2":"Prueba esto: explica ese proceso en español, en voz alta, a alguien que no sepa nada. ¿Sale ordenado?","dia":"Lunes","num":31,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Intentaste pensar el proceso y construir el inglés al mismo tiempo. Ejecutar algo todos los días no es lo mismo que poder explicarlo: nunca tuviste que ponerlo en orden para alguien que no lo conoce.","ancla":"M2 · Organize and Prioritize Your Message + Workplace Guide: Explaining a Process Clearly  ·  Clase real del 28/7"},{"f":"2026-09-02","tipo":"diferenciacion","sub":"Opinión picante","fmt":"reel","eje":"Método","mecanismo":"Criterio de selección: qué merece ocupar tu tiempo","cree":"\"Un buen programa es uno que cubre mucho.\"","diagnostico":"Un programa lleno de temas no te da más: te da más para no terminar. Y te instala la sensación de que siempre te falta algo.","lleva":"Un tema entra solo si se repite entre alumnas distintas, sirve en varios roles, y ayuda a comunicar bajo presión. Si le pasa a una sola, va a su sesión.","roadmap":"Roadmap · Regla: SE GRABA / SE INTEGRA / VA AL 1:1","origen":"Roadmap AT WORK","b":[["HOOK · 0-3 s","Tengo una regla para decidir qué entra a mi programa, y deja afuera casi todo."],["REHOOK · 4-7 s","Y te la cuento porque probablemente ya pagaste por lo contrario."],["EL PROBLEMA DE ELLA","Listas de phrasal verbs de negocios. Vocabulario de finanzas que no es tu área. Expresiones para situaciones que no tienes.\n\nNo estaba mal en sí. El problema es que te ocupó el tiempo de lo que sí ibas a usar. Y te dejó una sensación fea: que siempre te falta algo."],["EL GIRO","Un programa lleno de temas no te da más. Te da más para no terminar."],["MI CRITERIO","Por eso un tema entra solo si cumple tres cosas:\n\nse repite entre alumnas distintas,\nsirve en varios roles y no en uno solo,\ny te ayuda a comunicar mejor bajo presión.\n\nSi le pasa a una sola, no va al programa: va a su sesión."],["AHA","No necesitas un programa que cubra todo. Necesitas uno que haya decidido qué dejar afuera."],["CIERRE · texto en pantalla","Completo, sí. Enciclopédico, no.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Tengo una regla para decidir qué entra a mi programa, y deja afuera casi todo.\n\nTe la cuento porque probablemente ya pagaste por lo contrario: listas de vocabulario que nunca usaste, temas de áreas que no son la tuya, expresiones para situaciones que no tienes.\n\nUn programa lleno de temas no te da más. Te da más para no terminar.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"A cámara: \"¿Cuánto de lo que estudiaste en inglés usaste de verdad?\" Link al reel.","h2":"Cuéntame un tema que estudiaste y nunca usaste. Los leo todos.","dia":"Miércoles","num":2,"tipoNom":"Diferenciación","fmtNom":"Reel a cámara","tpl":{"nombre":"martes DIFERENCIACION","url":"https://www.canva.com/design?create=true&template=EAHKB4Xyhuc"},"micro":"Un programa lleno de temas no te da más: te da más para no terminar. Y te instala la sensación de que siempre te falta algo.","ancla":"Roadmap · Regla: SE GRABA / SE INTEGRA / VA AL 1:1  ·  Roadmap AT WORK"},{"f":"2026-09-04","tipo":"concientizacion","sub":"Error invisible","fmt":"carrusel","eje":"Visibility Gap","mecanismo":"Conocimiento sin automatización: la palabra correcta en la categoría equivocada","cree":"\"Si sueno poco profesional es porque me falta vocabulario.\"","diagnostico":"Conoces la palabra. Lo que falla es la forma de la palabra: dices el verbo donde el registro pedía el sustantivo. Y nadie te lo corrige porque igual se entiende.","lleva":"Ver el patrón una vez → entrenar las familias de palabras que se repiten en tu área → producirlas otra vez hasta que salgan primero.","roadmap":"M3 · Nominalization & Word Families for Professional English","origen":"Clase real del 28/7 · patrón detectado en dos alumnas distintas","b":[["SLIDE 1","Hay un error que cometes en cada reunión, que nadie te va a corregir nunca, y que te hace sonar menos profesional de lo que eres."],["SLIDE 2","Es este: dices \"we need to decide this\" donde el registro pedía \"we need a decision on this\".\n\nDices \"don't translation\" cuando querías decir \"don't translate\".\n\nLa raíz está bien. La categoría de la palabra, no."],["SLIDE 3","Y nadie te lo marca porque se entiende igual. Tu interlocutor completa el sentido y sigue.\n\nPor eso puede repetirse durante años sin que nadie diga nada."],["SLIDE 4","No es falta de vocabulario. Conoces la palabra. Podrías escribirla bien si te dieran diez segundos."],["SLIDE 5","Pero el inglés corporativo se apoya justo ahí.\n\n\"Decide\" es una acción que alguien hace.\n\"Decision\" es algo que se aprueba, se revisa, se documenta y se presenta.\n\nUna versión suena a alguien ejecutando. La otra, a alguien dirigiendo."],["SLIDE 6","Y ahí está el costo invisible: no suena mal. Suena junior.\n\nEs una diferencia que no aparece en ninguna corrección y sí aparece en cómo te tratan en la mesa."],["SLIDE 7","Esto no se arregla estudiando más vocabulario. Es la misma palabra que ya tienes, en otra forma.\n\nSe arregla viendo el patrón una vez y entrenando las familias que más se repiten en tu área, sobre frases que realmente usas."],["SLIDE 8 · CTA","Lo veo tan seguido entre alumnas distintas que dejó de ser un caso puntual: es uno de los sistemas que grabé aparte, porque aparece siempre.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Hay un error que cometes en cada reunión, que nadie te va a corregir nunca, y que te hace sonar menos profesional de lo que eres.\n\nDices \"we need to decide this\" donde el registro pedía \"we need a decision on this\". La raíz está bien; la categoría de la palabra, no.\n\nNadie te lo marca porque se entiende igual. Y no suena mal: suena junior.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"Hay un error que nadie te corrige porque igual se entiende.\" Invita a deslizar.","h2":"\"We need to decide this\" vs \"we need a decision on this\". Misma idea, otra persona del otro lado.","dia":"Viernes","num":4,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Conoces la palabra. Lo que falla es la forma de la palabra: dices el verbo donde el registro pedía el sustantivo. Y nadie te lo corrige porque igual se entiende.","ancla":"M3 · Nominalization & Word Families for Professional English  ·  Clase real del 28/7 · patrón detectado en dos alumnas distintas"},{"f":"2026-09-05","tipo":"concientizacion","sub":"Metodología","fmt":"carrusel","eje":"Executive Introduction","mecanismo":"La primera impresión como filtro de todo lo que viene después","cree":"\"Presentarme es dar mis datos. Lo importante viene después.\"","diagnostico":"Los primeros treinta segundos no informan: instalan la posición desde la que te van a escuchar el resto del proyecto. Todo lo que digas después pasa por ese filtro.","lleva":"Definir qué quieres que esa sala recuerde → armar las tres partes → entrenarlas con role play hasta que salgan sin pensarlas.","roadmap":"M2 · Workplace Practice Library · Introducing Yourself to a New Team","origen":"Workplace Guide","b":[["SLIDE 1","\"So, tell us a bit about yourself.\"\n\nY ahí dices tu nombre, tu cargo, hace cuánto estás en la empresa. Y se termina."],["SLIDE 2","No estuvo mal. Es información correcta y es lo que te preguntaron.\n\nEl problema es que es la misma respuesta que daría cualquiera de tu equipo cambiando el nombre."],["SLIDE 3","Y esos treinta segundos hacen algo que casi nadie mide: fijan desde qué lugar te van a escuchar durante el resto del proyecto.\n\nTodo lo que digas después pasa por ese filtro."],["SLIDE 4","Si te presentaste como la persona que ocupa un cargo, tus intervenciones se van a leer como reportes.\n\nSi te presentaste como la persona que resuelve un tipo de problema, las mismas intervenciones se leen como criterio."],["SLIDE 5","Misma información. Distinto lugar.\n\nY en un equipo nuevo, donde nadie te vio trabajar todavía, eso es literalmente todo lo que tienen de ti."],["SLIDE 6","Una introducción que funciona tiene tres partes:\n\nqué resuelves, no qué puesto ocupas,\nqué estás haciendo ahora que le importa a esta gente,\ny qué te interesa de estar en este proyecto."],["SLIDE 7","Fíjate que ninguna de las tres es tu cargo. El cargo dice dónde estás sentada. No dice qué pasa cuando estás en el proyecto."],["SLIDE 8 · CTA","Y esto no se improvisa cada vez. Se define una vez y se entrena, con role play, hasta que salga sin pensarla. En AT WORK tiene su propia guía de práctica.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"\"So, tell us a bit about yourself.\" Y ahí dices tu nombre, tu cargo, hace cuánto estás en la empresa. Y se termina.\n\nEs correcto. Y es la misma respuesta que daría cualquiera de tu equipo cambiando el nombre.\n\nEsos treinta segundos fijan desde qué lugar te van a escuchar el resto del proyecto. Si te presentaste como un cargo, tus intervenciones se leen como reportes. Si te presentaste como alguien que resuelve algo, se leen como criterio.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"¿Qué respondés cuando te dicen 'tell us about yourself'?\" Invita a deslizar.","h2":"Cuéntame qué dices hoy y te digo qué le falta.","dia":"Sábado","num":5,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Los primeros treinta segundos no informan: instalan la posición desde la que te van a escuchar el resto del proyecto. Todo lo que digas después pasa por ese filtro.","ancla":"M2 · Workplace Practice Library · Introducing Yourself to a New Team  ·  Workplace Guide"},{"f":"2026-09-06","tipo":"transformacion","sub":"Mini transformación","fmt":"reel","eje":"Questions Under Pressure","mecanismo":"Progreso sin aprendizaje nuevo","cree":"\"Para sonar mejor necesito saber más inglés.\"","diagnostico":"Entre una versión y la otra no aprendió veinte palabras nuevas. Hubo claridad del mensaje, el lenguaje justo que faltaba, feedback y retry.","lleva":"El progreso no siempre es aprender más inglés. A veces es usar mejor el que ya tienes.","roadmap":"M1 · Role Play Method + M2 · Organize and Prioritize Your Message","origen":"Clase real del 28/7","b":[["HOOK · 0-3 s","En una misma clase le hice practicar la misma conversación dos veces. La diferencia entre una y otra no fue el inglés."],["REHOOK · 4-7 s","Y quiero contarte qué pasó en el medio, porque explica bastante bien por qué te bloqueas."],["LA PRIMERA VEZ","Tenía que presentarse ante alguien de otra empresa y explicar a qué se dedica. Algo que hace todo el tiempo.\n\nSe perdió. Metió detalles que no hacían falta, dudó, se corrigió dos veces y no llegó al punto. No por nervios: estaba organizando mientras hablaba."],["EL MEDIO","No le enseñé veinte palabras nuevas.\n\nOrdenamos qué quería comunicar. Le di el lenguaje puntual que le faltaba, que eran tres o cuatro cosas. Le devolví qué había pasado. Y volvimos a hacerlo."],["LA SEGUNDA VEZ","Misma conversación. Más clara, más directa, más segura.\n\nVeinte minutos después."],["EL GIRO","En veinte minutos nadie aprende inglés nuevo.\n\nEl progreso no siempre es aprender más. A veces es usar mejor lo que ya tienes."],["CIERRE · texto en pantalla","Y eso se entrena mucho más rápido de lo que crees.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"En una misma clase le hice practicar la misma conversación dos veces. La diferencia entre una y otra no fue el inglés.\n\nEn el medio no hubo veinte palabras nuevas. Hubo claridad del mensaje, el lenguaje justo que faltaba, feedback y volver a hacerlo.\n\nEl progreso no siempre es aprender más inglés. A veces es usar mejor el que ya tienes.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"A cámara: \"La misma conversación, dos veces, con veinte minutos de diferencia.\" Link al reel.","h2":"¿Qué conversación tuya volverías a hacer si pudieras?","dia":"Domingo","num":6,"tipoNom":"Transformación y Deseo","fmtNom":"Reel a cámara","tpl":{"nombre":"jueves TRANSFORMACION Y DESEO","url":"https://www.canva.com/design?create=true&template=EAHKB4SjwII"},"micro":"Entre una versión y la otra no aprendió veinte palabras nuevas. Hubo claridad del mensaje, el lenguaje justo que faltaba, feedback y retry.","ancla":"M1 · Role Play Method + M2 · Organize and Prioritize Your Message  ·  Clase real del 28/7"},{"f":"2026-09-07","tipo":"concientizacion","sub":"Receta fallida","fmt":"carrusel","eje":"Perfectionism Under Pressure","mecanismo":"Quedarte pegada al error en vez de seguir","cree":"\"Si me equivoco, mejor corrijo antes de seguir.\"","diagnostico":"Cuando te frenás a corregir, tu atención se va del mensaje a la gramática. Y ahí perdés el hilo de verdad: no por el error, por la parada.","lleva":"Entrenar seguir hablando después del error. Grabarte diez minutos y no parar nunca, aunque te equivoques.","roadmap":"M2 · Repair and Continue","origen":"Roadmap AT WORK","b":[["SLIDE 1","Dijiste algo mal en la reunión. Y te frenaste a corregirlo. Ese freno te costó más que el error."],["SLIDE 2","Es un reflejo razonable. Te escuchaste, sonó mal, y quisiste arreglarlo antes de seguir."],["SLIDE 3","Pero mira lo que pasa en ese segundo: tu atención se va de lo que estabas diciendo hacia la gramática de lo que ya dijiste.\n\nY cuando vuelves, perdiste el hilo. No por el error. Por la parada."],["SLIDE 4","Además, el error casi nunca era el problema. La otra persona ya había entendido y seguía escuchando.\n\nLa que se quedó atrás fuiste tú."],["SLIDE 5","Lo que hacen las personas que se comunican bien bajo presión no es no equivocarse. Es no detenerse.\n\nSiguen, y si hace falta reformulan sobre la marcha, sin anunciar el error."],["SLIDE 6","Y esto se entrena de una forma muy concreta: grábate hablando diez minutos sobre un tema de tu trabajo, y no pares nunca. Aunque te equivoques. Aunque no te guste cómo salió."],["SLIDE 7","La primera vez es incómodo. A la tercera empiezas a notar que puedes reparar sin frenar, que es una habilidad distinta a hablar sin errores."],["SLIDE 8 · CTA","Reparar y continuar es una de las cuatro habilidades que trabajamos en AT WORK, justamente porque es la que más rápido cambia cómo te escuchan.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Dijiste algo mal en la reunión y te frenaste a corregirlo. Ese freno te costó más que el error.\n\nCuando paras, tu atención se va del mensaje a la gramática de lo que ya dijiste. Y cuando vuelves, perdiste el hilo.\n\nLa otra persona ya había entendido y seguía. La que se quedó atrás fuiste tú.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"¿Te frenás a corregirte cuando te equivocas hablando?\" Invita a deslizar.","h2":"Prueba esto: grábate diez minutos hablando de tu trabajo y no pares nunca.","dia":"Lunes","num":7,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Cuando te frenás a corregir, tu atención se va del mensaje a la gramática. Y ahí perdés el hilo de verdad: no por el error, por la parada.","ancla":"M2 · Repair and Continue  ·  Roadmap AT WORK"},{"f":"2026-09-09","tipo":"diferenciacion","sub":"Perspectiva única","fmt":"reel","eje":"Pronunciation / Connected Speech","mecanismo":"Por qué la pronunciación va al final y no al principio","cree":"\"Si mejoro mi pronunciación me van a tomar más en serio.\"","diagnostico":"La pronunciación es el resultado de todo lo anterior, no el punto de partida. Trabajarla primero es pulir una frase que todavía no puedes construir.","lleva":"Diagnóstico, activación, estructura y entrenamiento de situaciones. Y recién al final, inteligibilidad.","roadmap":"M4 · Understand & Be Understood · principio: intelligibility, no accent elimination","origen":"Roadmap AT WORK","b":[["HOOK · 0-3 s","En mi programa la pronunciación es lo último que trabajamos. Y no es un descuido."],["REHOOK · 4-7 s","Sé que suena al revés, porque es lo primero que casi todas quieren arreglar."],["EL PROBLEMA","Me lo piden desde la primera clase. \"Quiero perder el acento.\" \"Quiero que me entiendan mejor.\"\n\nY lo entiendo: es lo que más se escucha de una misma."],["MI POSTURA","Pero pulir cómo suena una frase que todavía no puedes construir con soltura es trabajar sobre algo que no está firme.\n\nPrimero tiene que salir la idea. Después nos ocupamos de cómo suena."],["EL ORDEN","Diagnóstico de lo que producís. Activar el vocabulario que ya tienes. Las estructuras que se repiten. Entrenar tus situaciones reales.\n\nY recién ahí, la pronunciación."],["AHA","Y cuando llega, el objetivo tampoco es sonar nativa. Es que se te entienda con claridad. El acento casi nunca es lo que frena una carrera."],["CIERRE · texto en pantalla","Lo último no es lo menos importante. Es lo que necesita que todo lo demás esté firme.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"En mi programa la pronunciación es lo último que trabajamos. Y no es un descuido.\n\nPulir cómo suena una frase que todavía no puedes construir con soltura es trabajar sobre algo que no está firme.\n\nY cuando llega, el objetivo no es sonar nativa: es que se te entienda. El acento casi nunca es lo que frena una carrera.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"A cámara: \"¿Por qué dejo la pronunciación para el final?\" Link al reel.","h2":"¿Cuánto tiempo pasaste tratando de perder el acento?","dia":"Miércoles","num":9,"tipoNom":"Diferenciación","fmtNom":"Reel a cámara","tpl":{"nombre":"martes DIFERENCIACION","url":"https://www.canva.com/design?create=true&template=EAHKB4Xyhuc"},"micro":"La pronunciación es el resultado de todo lo anterior, no el punto de partida. Trabajarla primero es pulir una frase que todavía no puedes construir.","ancla":"M4 · Understand & Be Understood · principio: intelligibility, no accent elimination  ·  Roadmap AT WORK"},{"f":"2026-09-11","tipo":"concientizacion","sub":"Mito / Creencia","fmt":"carrusel","eje":"Listening","mecanismo":"Connected speech: los nativos no hablan como el libro","cree":"\"No entiendo a los nativos porque mi nivel no alcanza.\"","diagnostico":"Entiendes cada palabra por separado. Lo que no estudiaste nunca es qué les pasa a las palabras cuando se juntan: sonidos que desaparecen, se pegan y cambian.","lleva":"Estudiar los patrones sonoros del habla real, no más vocabulario.","roadmap":"M4 · Why Real English Sounds Different","origen":"Roadmap AT WORK","b":[["SLIDE 1","Te hicieron creer que no entiendes a los nativos porque te falta nivel. Pero probablemente entiendes cada una de esas palabras por separado."],["SLIDE 2","La prueba: si te escriben la misma frase, la lees sin problema.\n\nEl problema no es el vocabulario. Es qué les pasa a las palabras cuando se juntan."],["SLIDE 3","\"What are you going to do?\" en el libro son cinco palabras.\n\nEn una reunión real suena como una sola: \"whatcha gonna do\"."],["SLIDE 4","Los sonidos se pegan, algunos desaparecen, otros cambian. Y el ritmo no es el que estudiaste: las palabras importantes se estiran y el resto se aplasta."],["SLIDE 5","Nadie te enseñó eso. Aprendiste las palabras una por una, bien pronunciadas, separadas. Como no se hablan nunca."],["SLIDE 6","Y la buena noticia es que no es aleatorio. El habla conectada tiene reglas: se pueden aprender y se empiezan a reconocer."],["SLIDE 7","Ahí pasa algo raro y muy rápido: la misma persona que te parecía imposible de seguir de golpe se entiende. No mejoraste tu oído. Aprendiste el patrón."],["SLIDE 8 · CTA","Por eso, cuando alguien me dice \"me falta listening\", lo primero que miro no es cuánto vocabulario tiene.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Te hicieron creer que no entiendes a los nativos porque te falta nivel. Pero si te escriben la misma frase, la lees sin problema.\n\nEl problema no es el vocabulario. Es qué les pasa a las palabras cuando se juntan.\n\n\"What are you going to do?\" son cinco palabras en el libro. En una reunión suena como una sola.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"¿Lees inglés sin problema pero no entiendes cuando hablan?\" Invita a deslizar.","h2":"No es tu oído. Es que nadie te enseñó cómo suena el inglés real.","dia":"Viernes","num":11,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Entiendes cada palabra por separado. Lo que no estudiaste nunca es qué les pasa a las palabras cuando se juntan: sonidos que desaparecen, se pegan y cambian.","ancla":"M4 · Why Real English Sounds Different  ·  Roadmap AT WORK"},{"f":"2026-09-12","tipo":"concientizacion","sub":"Error invisible","fmt":"carrusel","eje":"Executive Communication","mecanismo":"Modales: cuánta fuerza le estás poniendo sin querer","cree":"\"Estoy siendo educada.\"","diagnostico":"Traducís la cortesía del español directo al inglés y terminás sonando insegura. \"I think maybe we could try\" no suena amable: suena a que no estás convencida de tu propia propuesta.","lleva":"Controlar fuerza, posibilidad y obligación a propósito, no por defecto.","roadmap":"M3 · Say How Strong You Mean It — Modals, Certainty & Obligation","origen":"Roadmap AT WORK","b":[["SLIDE 1","Dijiste \"I think maybe we could try this\" y creíste que estabas siendo educada. Sonaste a que no estás convencida de tu propia idea."],["SLIDE 2","Y no lo hiciste por inseguridad. Lo hiciste porque en español atenuamos mucho: \"yo creería\", \"tal vez podríamos\", \"no sé si\".\n\nEs cortesía. Suena bien."],["SLIDE 3","El tema es que en inglés cada uno de esos atenuadores baja la fuerza de lo que dices. Y si los apilas, no queda casi nada."],["SLIDE 4","\"I think\" ya baja un escalón.\n\"Maybe\" baja otro.\n\"Could\" baja otro.\n\"Try\" baja otro.\n\nCuatro capas encima de una propuesta que era buena."],["SLIDE 5","Del otro lado no escuchan a alguien amable. Escuchan a alguien que no está segura. Y actúan en consecuencia: no la toman."],["SLIDE 6","La versión con la misma cortesía y otra fuerza sería: \"I'd suggest we try this — it solves X.\"\n\nSigue siendo educada. Pero ahora hay alguien sosteniendo la idea."],["SLIDE 7","Esto no es un tema de vocabulario ni de acento. Es saber cuánta fuerza estás poniendo, y ponerla a propósito."],["SLIDE 8 · CTA","Lo trabajamos como sistema, no como lista: cuándo quieres sonar firme, cuándo quieres dejar la puerta abierta, y cómo se dice cada una.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Dijiste \"I think maybe we could try this\" y creíste que estabas siendo educada.\n\nEn español atenuamos por cortesía. En inglés cada atenuador baja la fuerza de lo que dices, y si los apilas no queda casi nada.\n\nDel otro lado no escuchan a alguien amable. Escuchan a alguien que no está segura.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"¿Cuántos 'maybe' y 'I think' metés antes de tu propuesta?\" Invita a deslizar.","h2":"Educada y firme no son opuestos. Se dicen distinto, nada más.","dia":"Sábado","num":12,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Traducís la cortesía del español directo al inglés y terminás sonando insegura. \"I think maybe we could try\" no suena amable: suena a que no estás convencida de tu propia propuesta.","ancla":"M3 · Say How Strong You Mean It — Modals, Certainty & Obligation  ·  Roadmap AT WORK"},{"f":"2026-09-13","tipo":"transformacion","sub":"Logro cotidiano","fmt":"reel","eje":"Meetings / Disagreeing","mecanismo":"Pedir aclaración en vez de decir que sí","cree":"\"Si pregunto queda mal, van a pensar que no entendí.\"","diagnostico":"Decir \"okay\" cuando no entendiste no te hace quedar bien: te deja comprometida con algo que no sabes qué es. Pedir aclaración es una señal de autoridad, no de falta.","lleva":"Frases para pedir aclaración y confirmar comprensión, entrenadas hasta que salgan sin pensarlas.","roadmap":"M2 · Manage the Interaction + Guide: Disagreeing or Clarifying Politely","origen":"Patrón recurrente en clases","b":[["HOOK · 0-3 s","Una alumna me contó algo esta semana que parece chiquito y no lo es: preguntó."],["REHOOK · 4-7 s","En una reunión, en inglés, delante de todos, dijo que no había entendido bien."],["EL ANTES","Antes hacía lo que hacen casi todas: decía \"okay, okay\", asentía, y después trataba de reconstruir por el chat o preguntándole a alguien.\n\nNo por vergüenza. Porque creía que preguntar la iba a hacer quedar peor."],["LO QUE CAMBIÓ","Trabajamos dos o tres frases para pedir aclaración sin que suene a que estás perdida. \"Just to make sure I got that right…\", \"Can you walk me through that part again?\"\n\nEntrenadas hasta que salieran solas."],["EL DESPUÉS","La usó. Y no pasó nada de lo que temía. Le explicaron, siguió la reunión, y se fue sabiendo a qué se estaba comprometiendo."],["AHA","Decir \"okay\" cuando no entendiste no te hace quedar bien. Te deja comprometida con algo que no sabes qué es.\n\nPreguntar es una señal de autoridad, no de falta."],["CIERRE · texto en pantalla","Y es de las cosas que más rápido se entrenan.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Una alumna preguntó. En una reunión, en inglés, delante de todos, dijo que no había entendido bien.\n\nAntes decía \"okay, okay\" y después reconstruía por chat. Porque creía que preguntar la haría quedar peor.\n\nDecir que sí cuando no entendiste no te hace quedar bien: te deja comprometida con algo que no sabes qué es.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"A cámara: \"¿Dices 'okay' cuando en realidad no entendiste?\" Link al reel.","h2":"Preguntar es señal de autoridad, no de falta.","dia":"Domingo","num":13,"tipoNom":"Transformación y Deseo","fmtNom":"Reel a cámara","tpl":{"nombre":"jueves TRANSFORMACION Y DESEO","url":"https://www.canva.com/design?create=true&template=EAHKB4SjwII"},"micro":"Decir \"okay\" cuando no entendiste no te hace quedar bien: te deja comprometida con algo que no sabes qué es. Pedir aclaración es una señal de autoridad, no de falta.","ancla":"M2 · Manage the Interaction + Guide: Disagreeing or Clarifying Politely  ·  Patrón recurrente en clases"},{"f":"2026-09-14","tipo":"concientizacion","sub":"Verdadero problema","fmt":"carrusel","eje":"Questions Under Pressure","mecanismo":"Seguir hablando cuando la palabra no aparece","cree":"\"Me quedo en blanco porque me falta vocabulario.\"","diagnostico":"Una palabra que no aparece no debería secuestrar la idea entera. Lo que falta no es la palabra: es qué hacer en los dos segundos en que no está.","lleva":"Tres salidas entrenadas: describir para qué sirve, dar un ejemplo, o decirlo más largo.","roadmap":"M2 · Keep Speaking When the Word Doesn't Come","origen":"Roadmap AT WORK","b":[["SLIDE 1","Ibas bien. Y se te fue una palabra. Y ahí se cayó toda la frase."],["SLIDE 2","Lo que pasó después lo conocés: silencio, una vuelta larga, un \"how do you say…\", y la idea que tenías clarísima llegó a medias."],["SLIDE 3","Y la conclusión que sacas es que te falta vocabulario.\n\nPero fíjate el tamaño del problema: una palabra se llevó puesta una idea entera."],["SLIDE 4","Eso no es un problema de cuánto sabes. Es un problema de qué haces en los dos segundos en que esa palabra no está."],["SLIDE 5","Las personas que se comunican bien en su segundo idioma no es que nunca pierdan una palabra. Es que tienen salidas."],["SLIDE 6","Y son tres, y se entrenan:\n\ndescribir para qué sirve la cosa,\ndar un ejemplo concreto,\no decirlo más largo, con las palabras que sí tienes."],["SLIDE 7","\"The thing we use to…\", \"like when you…\", \"the process where…\".\n\nNo es un parche. Es una habilidad real, y en una reunión vale más que veinte palabras nuevas."],["SLIDE 8 · CTA","Tu objetivo no es llegar al punto donde nunca te falte una palabra. Es llegar al punto donde una palabra no pueda secuestrar tu idea.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Ibas bien. Se te fue una palabra. Y se cayó la frase entera.\n\nEso no es un problema de cuánto sabes: es qué haces en los dos segundos en que esa palabra no está.\n\nTu objetivo no es no perder nunca una palabra. Es que una palabra no pueda secuestrar tu idea.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"¿Se te cae la frase entera cuando se te va una palabra?\" Invita a deslizar.","h2":"Tres salidas: descríbela, da un ejemplo, o dila más largo.","dia":"Lunes","num":14,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Una palabra que no aparece no debería secuestrar la idea entera. Lo que falta no es la palabra: es qué hacer en los dos segundos en que no está.","ancla":"M2 · Keep Speaking When the Word Doesn't Come  ·  Roadmap AT WORK"},{"f":"2026-09-16","tipo":"diferenciacion","sub":"Detrás de escena","fmt":"reel","eje":"Método","mecanismo":"Cómo distingo un error fosilizado de un vacío de base","cree":"\"Un error es un error, se corrige igual.\"","diagnostico":"Hay dos errores que se ven idénticos y necesitan cosas opuestas: uno se resuelve con una explicación, el otro solo con producción repetida. Confundirlos cuesta meses.","lleva":"Diagnóstico sobre su propia producción antes de decidir qué entrenar.","roadmap":"M1 · Narrative Flow · knowledge gap vs fossilized pattern","origen":"Roadmap AT WORK","b":[["HOOK · 0-3 s","Hay dos errores que se ven exactamente iguales y necesitan cosas opuestas. Confundirlos te puede costar meses."],["REHOOK · 4-7 s","Y es lo primero que miro cuando empiezo a trabajar con alguien."],["EL PRIMERO","Uno es un vacío de base: nunca aprendiste esa estructura. Nadie te la explicó, o la viste una vez hace quince años.\n\nEse se resuelve con una explicación buena. Una vez."],["EL SEGUNDO","El otro es un error fosilizado: lo sabes perfectamente. Si te lo señalo, lo corriges sola en un segundo.\n\nY aun así te sale mal cada vez que hablas, porque llevas años diciéndolo de la otra forma."],["POR QUÉ IMPORTA","Si tratás un error fosilizado como si fuera un vacío, le explicás la regla otra vez a alguien que ya la sabe. Y no cambia nada.\n\nSi tratás un vacío como si fuera fosilizado, la haces repetir algo que nunca entendió."],["CÓMO LOS SEPARO","Con su propia producción delante, no con un ejercicio. Le señalo el error y miro qué pasa.\n\nSi se corrige sola al instante: fosilizado. Si me mira sin saber qué le estoy marcando: vacío de base."],["CIERRE · texto en pantalla","Dos minutos de diagnóstico ahorran meses de entrenar lo que no era.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Hay dos errores que se ven exactamente iguales y necesitan cosas opuestas.\n\nUno nunca lo aprendiste: se resuelve con una explicación. El otro lo sabes perfectamente y aun así te sale mal: ese solo se resuelve produciendo otra vez.\n\nConfundirlos cuesta meses de entrenar lo que no era.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"A cámara: \"Dos errores idénticos que necesitan cosas opuestas.\" Link al reel.","h2":"Si te lo señalo y te corriges sola en un segundo: no te falta teoría.","dia":"Miércoles","num":16,"tipoNom":"Diferenciación","fmtNom":"Reel a cámara","tpl":{"nombre":"martes DIFERENCIACION","url":"https://www.canva.com/design?create=true&template=EAHKB4Xyhuc"},"micro":"Hay dos errores que se ven idénticos y necesitan cosas opuestas: uno se resuelve con una explicación, el otro solo con producción repetida. Confundirlos cuesta meses.","ancla":"M1 · Narrative Flow · knowledge gap vs fossilized pattern  ·  Roadmap AT WORK"},{"f":"2026-09-18","tipo":"concientizacion","sub":"Costo de no cambiar","fmt":"carrusel","eje":"Leadership","mecanismo":"Lo que se decide en los cinco minutos antes de la reunión","cree":"\"El small talk es relleno, lo importante es la reunión.\"","diagnostico":"Las decisiones sobre quién entra a qué proyecto no siempre se toman en la reunión formal. Se toman en el pasillo, en el chat de después y en esos cinco minutos.","lleva":"Estructuras de entrada y reacción entrenadas hasta que salgan sin pensarlas.","roadmap":"M2 · Workplace Guide: Making Small Talk Before a Meeting","origen":"Roadmap AT WORK","b":[["SLIDE 1","Entrás cinco minutos antes a la llamada. Hay dos personas hablando de cualquier cosa. Tú pones la cámara y esperás en silencio."],["SLIDE 2","No es timidez. Es que en esos cinco minutos no sabes qué decir, y meterte a mitad de una charla informal en inglés te expone más que la reunión misma."],["SLIDE 3","Y esos cinco minutos parecen no importar. Es charla suelta. El tema serio empieza después."],["SLIDE 4","Pero mira cómo funcionan las cosas de verdad: las decisiones sobre quién entra a qué proyecto, a quién se le pregunta la opinión, con quién dan ganas de trabajar, no siempre se toman en la reunión formal."],["SLIDE 5","Se toman en el pasillo, en el chat después, y en esos cinco minutos.\n\nY cada vez que los pasas en silencio, no estás quedando neutra. Estás quedando afuera de eso."],["SLIDE 6","Lo que se acumula no es un mal momento. Es la sensación, en los demás, de que eres alguien que hace su trabajo y no mucho más."],["SLIDE 7","Y esto tiene solución concreta, no motivacional: el small talk profesional tiene estructuras de entrada y de reacción. Se aprenden y se automatizan."],["SLIDE 8 · CTA","No es carisma. Es un repertorio chico de frases disponibles sin pensarlas, entrenado hasta que salga solo.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Entrás cinco minutos antes a la llamada. Hay dos personas charlando. Tú esperás en silencio.\n\nParece que no importa. Pero las decisiones sobre quién entra a qué proyecto no siempre se toman en la reunión formal: se toman en el pasillo y en esos cinco minutos.\n\nCada vez que los pasas en silencio no quedas neutra. Quedas afuera.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"¿Qué haces en los cinco minutos antes de que empiece la reunión?\" Invita a deslizar.","h2":"No es carisma. Es un repertorio chico, entrenado.","dia":"Viernes","num":18,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Las decisiones sobre quién entra a qué proyecto no siempre se toman en la reunión formal. Se toman en el pasillo, en el chat de después y en esos cinco minutos.","ancla":"M2 · Workplace Guide: Making Small Talk Before a Meeting  ·  Roadmap AT WORK"},{"f":"2026-09-19","tipo":"filtro","sub":"Esto no es para vos","fmt":"post","eje":"Método","mecanismo":"El límite: para quién no funciona esto","cree":"\"Si pago un programa bueno, voy a mejorar.\"","diagnostico":"Este programa no funciona sin producción entre sesiones. No es una cuestión de esfuerzo ni de ganas: es que el cambio ocurre justo ahí, y sin eso no hay método que alcance.","lleva":"Filtrar antes de empezar, para no frustrarnos las dos.","roadmap":"Roadmap · Para quién NO es · mentalidad","origen":"Roadmap AT WORK","b":[["HOOK","Si estás buscando un programa donde aparecer una vez por semana y que el resto lo resuelva yo, este no es."],["EL LÍMITE","Y no lo digo como reto ni para hacerme la exigente. Lo digo porque ya me pasó de empezar con alguien que quería eso, y terminamos las dos frustradas."],["POR QUÉ","La sesión conmigo es una hora. Tu semana tiene cuarenta de trabajo en inglés.\n\nSi el cambio dependiera de esa hora, sería un cambio muy chico. El cambio pasa en lo que haces entre una sesión y la siguiente."],["PARA QUIÉN NO ES","No es para quien busca inglés general o preparar un examen.\nNo es para quien quiere memorizar respuestas.\nNo es para quien necesita sentirse perfecta antes de hablar.\nNo es para quien no va a tocar nada de su semana."],["PARA QUIÉN SÍ","Es para ti si ya trabajas en inglés, si estás dispuesta a producir y equivocarte, y si puedes poner quince minutos entre sesiones.\n\nQuince. No dos horas."],["CTA","Si leíste esto y en vez de asustarte te dieron ganas, hablemos.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Si buscas un programa donde aparecer una vez por semana y que el resto lo resuelva yo, este no es.\n\nLa sesión conmigo es una hora. Tu semana tiene cuarenta de trabajo en inglés. Si el cambio dependiera de esa hora, sería un cambio muy chico.\n\nEs para ti si estás dispuesta a producir, equivocarte, y poner quince minutos entre sesiones.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"Esto no es para todas, y prefiero decirlo antes.\"","h2":"Si te dieron ganas en vez de miedo, escríbeme.","dia":"Sábado","num":19,"tipoNom":"Filtro / Repele","fmtNom":"Post simple","tpl":{"nombre":"template at work","url":"https://www.canva.com/design?create=true&template=EAHST4KGYjA"},"micro":"Este programa no funciona sin producción entre sesiones. No es una cuestión de esfuerzo ni de ganas: es que el cambio ocurre justo ahí, y sin eso no hay método que alcance.","ancla":"Roadmap · Para quién NO es · mentalidad  ·  Roadmap AT WORK"},{"f":"2026-09-20","tipo":"transformacion","sub":"Avance en proceso","fmt":"reel","eje":"Visibility Gap","mecanismo":"Autonomía: necesitarme cada vez menos","cree":"\"Voy a necesitar clases para siempre.\"","diagnostico":"El objetivo no es que vengas más. Es que detectes tus propios errores sin que nadie te los marque. Cuando eso pasa, tu progreso deja de depender de mi agenda.","lleva":"Un sistema para practicar sola con tu propio material, y medir el progreso por cuánto detectas sin ayuda.","roadmap":"Roadmap · Desarrollar autonomía para detectar, practicar y corregir sus propios gaps","origen":"Roadmap AT WORK","b":[["HOOK · 0-3 s","Hay un momento en el proceso que espero con más ganas que cualquier otro. Y es cuando dejan de necesitarme."],["REHOOK · 4-7 s","Suena raro para alguien que vive de esto, ya sé. Te explico por qué."],["LA SEÑAL","Pasa así: la alumna está hablando, comete un error, y antes de que yo abra la boca se frena, se corrige, y sigue.\n\nNadie se lo marcó."],["QUÉ SIGNIFICA","Que ya no está esperando que alguien de afuera le diga qué está mal. Empezó a escucharse mientras habla.\n\nY eso es lo único que hace que el progreso siga cuando yo no estoy."],["POR QUÉ IMPORTA","Porque si tu avance depende de que alguien te corrija, tu velocidad es la velocidad de tu agenda de clases. Una hora por semana.\n\nCuando detectas sola, tu velocidad pasa a ser la de tu semana entera."],["AHA","Mi trabajo no termina cuando entiendes lo que te explico. Termina cuando ya no me necesitas para verlo."],["CIERRE · texto en pantalla","No quiero alumnas para siempre. Quiero alumnas que aprendan a resolver.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Hay un momento del proceso que espero con más ganas que cualquier otro: cuando dejan de necesitarme.\n\nLa alumna habla, comete un error, y antes de que yo diga nada se frena, se corrige y sigue.\n\nSi tu avance depende de que alguien te corrija, tu velocidad es la de tu agenda de clases. Cuando detectas sola, es la de tu semana entera.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"A cámara: \"El momento que más espero es cuando dejan de necesitarme.\" Link al reel.","h2":"No quiero alumnas para siempre. Quiero alumnas que aprendan a resolver.","dia":"Domingo","num":20,"tipoNom":"Transformación y Deseo","fmtNom":"Reel a cámara","tpl":{"nombre":"jueves TRANSFORMACION Y DESEO","url":"https://www.canva.com/design?create=true&template=EAHKB4SjwII"},"micro":"El objetivo no es que vengas más. Es que detectes tus propios errores sin que nadie te los marque. Cuando eso pasa, tu progreso deja de depender de mi agenda.","ancla":"Roadmap · Desarrollar autonomía para detectar, practicar y corregir sus propios gaps  ·  Roadmap AT WORK"},{"f":"2026-09-21","tipo":"concientizacion","sub":"Error invisible","fmt":"carrusel","eje":"Executive Communication","mecanismo":"Traducir el patrón, no solo las palabras","cree":"\"Ya no traduzco palabra por palabra, entonces no estoy traduciendo.\"","diagnostico":"Dejaste de traducir palabras pero sigues traduciendo la estructura: armas la frase con el orden del español y le pones palabras en inglés encima.","lleva":"Aprender los patrones completos del inglés como bloques, no construir cada frase de cero.","roadmap":"M3 · Stop Translating the Pattern","origen":"Roadmap AT WORK","b":[["SLIDE 1","Dejaste de traducir palabra por palabra hace rato. Pero probablemente sigues traduciendo, y no te diste cuenta."],["SLIDE 2","Porque hay dos traducciones distintas. Una es obvia: pensás \"reunión\" y buscas \"meeting\". Esa ya la superaste."],["SLIDE 3","La otra es invisible: armas la frase con el orden del español, y después le pones palabras en inglés encima."],["SLIDE 4","Sale algo que no está mal exactamente, pero suena raro. \"I have 5 years working here.\" \"Depends of the client.\" \"I am agree.\"\n\nCada palabra es correcta. La estructura viene de otro idioma."],["SLIDE 5","Y es más difícil de detectar que la otra, porque nadie te corrige: se entiende, y a esa altura ya nadie te marca cosas chicas."],["SLIDE 6","Lo que pasa en realidad es que estás construyendo cada frase de cero, con las reglas equivocadas, mientras hablas. Eso consume toda tu atención."],["SLIDE 7","Las personas que suenan naturales no arman cada frase: tienen bloques enteros ya listos. \"I've been working here for…\", \"it depends on…\", \"I agree\".\n\nNo lo construyen. Lo sacan."],["SLIDE 8 · CTA","Por eso trabajo con chunks y con patrones completos, no con palabras sueltas. Construir menos es lo que te libera la cabeza para pensar en lo que quieres decir.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Dejaste de traducir palabra por palabra. Pero probablemente sigues traduciendo la estructura.\n\n\"I have 5 years working here.\" \"Depends of the client.\" Cada palabra correcta, la estructura de otro idioma.\n\nNadie te lo corrige porque se entiende. Y mientras tanto estás construyendo cada frase de cero, con las reglas equivocadas.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"Hay una traducción que sigues haciendo sin darte cuenta.\" Invita a deslizar.","h2":"Las que suenan naturales no arman cada frase. La sacan entera.","dia":"Lunes","num":21,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Dejaste de traducir palabras pero sigues traduciendo la estructura: armas la frase con el orden del español y le pones palabras en inglés encima.","ancla":"M3 · Stop Translating the Pattern  ·  Roadmap AT WORK"},{"f":"2026-09-23","tipo":"diferenciacion","sub":"Valores de marca","fmt":"reel","eje":"Método","mecanismo":"Por qué no corrijo todo","cree":"\"Cuanto más me corrijan, más aprendo.\"","diagnostico":"Corregir todo satura y destruye la confianza más rápido que cualquier error. Elijo dos o tres cosas por sesión: las que más te cambian cómo te escuchan.","lleva":"Priorizar qué se corrige, en vez de marcar todo lo que aparece.","roadmap":"Roadmap · el 1:1 se reserva para personalización y transferencia","origen":"Roadmap AT WORK","b":[["HOOK · 0-3 s","No corrijo todos tus errores. Y lo hago a propósito."],["REHOOK · 4-7 s","Sé que si estás pagando una clase, esto puede sonar a que no estoy haciendo mi trabajo."],["EL PROBLEMA","Cuando alguien te marca todo lo que dices mal, pasan dos cosas. La primera: te saturas. No puedes retener quince correcciones en una hora, así que no retienes ninguna."],["LA SEGUNDA","Y la segunda es peor. Empiezas a hablar pensando en no equivocarte, en vez de en lo que quieres decir.\n\nCorregir todo destruye la confianza más rápido que cualquier error."],["QUÉ HAGO","Elijo dos o tres cosas por sesión. Las que más aparecen, y las que más cambian cómo te escuchan.\n\nEl resto lo veo, lo anoto, y espera su turno."],["AHA","No es que el resto no importe. Es que corregirlo hoy no te sirve.\n\nMi trabajo no es marcarte todo lo que veo. Es elegir qué te va a mover ahora."],["CIERRE · texto en pantalla","Dos cosas bien entrenadas valen más que quince marcadas.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"No corrijo todos tus errores, y lo hago a propósito.\n\nCuando te marcan todo, pasan dos cosas: te saturas y no retienes ninguna, y empiezas a hablar pensando en no equivocarte en vez de en lo que quieres decir.\n\nCorregir todo destruye la confianza más rápido que cualquier error.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"A cámara: \"No corrijo todos tus errores. Y es a propósito.\" Link al reel.","h2":"Dos cosas bien entrenadas valen más que quince marcadas.","dia":"Miércoles","num":23,"tipoNom":"Diferenciación","fmtNom":"Reel a cámara","tpl":{"nombre":"martes DIFERENCIACION","url":"https://www.canva.com/design?create=true&template=EAHKB4Xyhuc"},"micro":"Corregir todo satura y destruye la confianza más rápido que cualquier error. Elijo dos o tres cosas por sesión: las que más te cambian cómo te escuchan.","ancla":"Roadmap · el 1:1 se reserva para personalización y transferencia  ·  Roadmap AT WORK"},{"f":"2026-09-25","tipo":"concientizacion","sub":"Objeción","fmt":"carrusel","eje":"Perfectionism Under Pressure","mecanismo":"Esperar a estar lista como forma de postergar","cree":"\"Cuando tenga mejor nivel, empiezo a participar más.\"","diagnostico":"La sensación de estar lista no llega antes de actuar: llega después de haber actuado varias veces. Esperarla es exactamente lo que la retrasa.","lleva":"Participar con el nivel que ya tienes, acumulando evidencia de que puedes.","roadmap":"Onboarding · Pilares de mentalidad · producir antes de perfeccionar","origen":"Roadmap AT WORK","b":[["SLIDE 1","\"Cuando tenga mejor nivel, empiezo a participar más.\" Llevas años diciéndote esa frase."],["SLIDE 2","Y suena responsable. Primero me preparo bien, después me expongo. Es lo que haríamos con cualquier otra cosa."],["SLIDE 3","Pero prueba esto: acuérdate de cuál era tu nivel hace dos años.\n\nHoy es mejor. ¿Y participas más?"],["SLIDE 4","Casi siempre la respuesta es que no. Porque el nivel subió y el umbral también.\n\nSiempre falta un poco más. Ese poco más no se termina nunca."],["SLIDE 5","Y acá está el problema real: la sensación de estar lista no llega antes de actuar. Llega después de haber actuado varias veces y comprobado que no pasó nada grave."],["SLIDE 6","O sea que estás esperando un resultado que solo puede aparecer si haces justo lo que estás postergando."],["SLIDE 7","No te estoy diciendo que te tires sin preparación. Te estoy diciendo que la preparación que te falta no es de nivel. Es de evidencia."],["SLIDE 8 · CTA","Y la evidencia se construye participando con el nivel que ya tienes, en situaciones entrenadas antes, no improvisando en la reunión más importante del año.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"\"Cuando tenga mejor nivel, empiezo a participar más.\" Llevas años diciéndote esa frase.\n\nAcuérdate de tu nivel hace dos años. Hoy es mejor. ¿Participas más?\n\nEl nivel subió y el umbral también. La sensación de estar lista no llega antes de actuar: llega después.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"¿Hace cuánto que estás esperando tener mejor nivel?\" Invita a deslizar.","h2":"El umbral sube con ti. Ese poco más no se termina nunca.","dia":"Viernes","num":25,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"La sensación de estar lista no llega antes de actuar: llega después de haber actuado varias veces. Esperarla es exactamente lo que la retrasa.","ancla":"Onboarding · Pilares de mentalidad · producir antes de perfeccionar  ·  Roadmap AT WORK"},{"f":"2026-09-26","tipo":"concientizacion","sub":"Hoja de ruta","fmt":"carrusel","eje":"Executive Communication","mecanismo":"Cómo se prepara una conversación difícil, en orden","cree":"\"Voy a escribir lo que quiero decir y practicarlo.\"","diagnostico":"Preparar el texto entrena recordarlo. Preparar la conversación entrena sostenerla cuando el otro no sigue tu guion.","lleva":"Cinco pasos, en orden, sobre la conversación real que tienes esta semana.","roadmap":"M2 · Manage the Interaction + Guide: Explaining a Problem and the Next Steps","origen":"Roadmap AT WORK","b":[["SLIDE 1","Tienes que dar una mala noticia en inglés el martes. Si me preguntas cómo la prepararía, no es escribiendo lo que vas a decir."],["SLIDE 2","PASO 1. Decide qué necesitas que pase después de esa conversación. No qué vas a decir: qué quieres que la otra persona haga o entienda al salir."],["SLIDE 3","PASO 2. Escribe tres frases, no un texto: qué pasó, qué estás haciendo al respecto, y qué necesitas de la otra parte.\n\nEse es todo el contenido. El resto es conversación."],["SLIDE 4","PASO 3. Busca el vocabulario puntual que te va a faltar. No una lista: las cinco o seis cosas específicas de este tema que sabes que no vas a tener a mano."],["SLIDE 5","PASO 4. Practica esas tres frases en voz alta, de tres maneras distintas. Distintas de verdad, no la misma con otra puntuación.\n\nAsí no dependes de una sola versión."],["SLIDE 6","PASO 5. Y esto es lo que casi nadie hace: pídele a alguien que te interrumpa. Que te pregunte algo que no preparaste. Que te lleve a otro lado.\n\nAhí es donde se cae el guion, y donde tienes que entrenar."],["SLIDE 7","Fíjate la diferencia. Preparar el texto entrena recordarlo. Preparar la conversación entrena sostenerla cuando el otro no sigue tu libreto."],["SLIDE 8 · CTA","Eso último es lo que hacemos en la sesión: tu conversación real de esta semana, con las preguntas que no esperás.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Tienes que dar una mala noticia en inglés el martes. No la prepares escribiendo lo que vas a decir.\n\nDecide qué quieres que pase después. Escribe tres frases, no un texto. Busca el vocabulario puntual. Practicalas de tres maneras distintas. Y pídele a alguien que te interrumpa.\n\nPreparar el texto entrena recordarlo. Preparar la conversación entrena sostenerla.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"¿Cómo preparas una conversación difícil en inglés?\" Invita a deslizar.","h2":"El paso que casi nadie hace: pedir que te interrumpan.","dia":"Sábado","num":26,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Preparar el texto entrena recordarlo. Preparar la conversación entrena sostenerla cuando el otro no sigue tu guion.","ancla":"M2 · Manage the Interaction + Guide: Explaining a Problem and the Next Steps  ·  Roadmap AT WORK"},{"f":"2026-09-27","tipo":"transformacion","sub":"Caso de estudio","fmt":"carrusel","eje":"Executive Communication","mecanismo":"Del detalle desordenado a la estructura de tres partes","cree":"\"Si doy todos los detalles, se entiende mejor.\"","diagnostico":"Dar más información no muestra que sabes más: muestra que no elegiste. La audiencia necesita el estado, el avance y el próximo paso, en ese orden.","lleva":"Estado en una frase → solo lo que avanzó → solo el próximo paso. Menos de dos minutos.","roadmap":"M2 · Organize and Prioritize + Guide: Giving a Clear Project Update","origen":"Patrón recurrente en clases","b":[["SLIDE 1","Una alumna llegó convencida de que le faltaba gramática. Su problema era que decía demasiado."],["SLIDE 2","EL ANTES. Cada vez que su manager pedía un update, ella arrancaba por el principio: el contexto, lo que había pasado, la complicación, lo que faltaba, lo que dependía de otro equipo.\n\nTodo cierto. Todo mezclado."],["SLIDE 3","Y salía de la reunión con la sensación de haber hablado mucho y explicado poco."],["SLIDE 4","LO QUE NO ERA. No era gramática. En la primera sesión de role play le pregunté por su especialidad, algo que domina, y en un minuto aparecieron cinco ideas distintas, todas encimadas.\n\nEl idioma no era el problema: el orden sí."],["SLIDE 5","EL PROCESO. Trabajamos una estructura de tres partes.\n\nEstado en una frase: \"the project is on track\".\nDespués, solo lo que avanzó.\nDespués, solo el próximo paso."],["SLIDE 6","Nada más. Menos de dos minutos. Si quieren detalle, lo van a pedir."],["SLIDE 7","EL DESPUÉS. Me dijo algo que me quedó: \"por primera vez salí de una reunión sin quedarme pensando en todo lo que dije de más\"."],["SLIDE 8 · CTA","Dar más información no muestra que sabes más. Muestra que no elegiste qué importaba.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Una alumna llegó convencida de que le faltaba gramática. Su problema era que decía demasiado.\n\nCada update arrancaba por el contexto, la complicación, lo que faltaba. Todo cierto, todo mezclado.\n\nTrabajamos tres partes: estado en una frase, lo que avanzó, el próximo paso. Menos de dos minutos.\n\nEscríbeme AT WO as en español","origen":"Historia de marca","b":[["HOOK · 0-3 s","Podría enseñar inglés general y me iría bien. Elegí no hacerlo, y te cuento por qué."],["REHOOK · 4-7 s","Tiene que ver con una frase que escuché tantas veces que dejó de sonarme a casualidad."],["LA FRASE","\"Yo sé lo que quiero decir. Pero en inglés no me sale.\"\n\nMe la dijeron contadoras, ingenieras, médicas, managers. Mujeres con veinte años de carrera."],["LO QUE VI","Y cuando las escuché hablar, no eran principiantes. Entendían, leían documentación técnica, sostenían una conversación.\n\nLo que no podían era mostrar, en inglés, lo que evidentemente sabían."],["POR QUÉ CAMBIÉ","Ahí entendí que su problema no aparecía en un examen. Aparecía el martes a las nueve, en una reunión concreta, con alguien esperando que hablaran.\n\nY para eso, un curso general no sirve. Aunque esté bien hecho."],["MI DECISIÓN","Por eso trabajo con su material real. Su reunión, su industria, su vocabulario, su semana.\n\nNo porque suene mejor. Porque es donde está el problema."],["CIERRE · texto en pantalla","No enseño inglés. Trabajo sobre lo que ese idioma te está impidiendo mostrar.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Podría enseñar inglés general y me iría bien. Elegí no hacerlo.\n\n\"Yo sé lo que quiero decir, pero en inglés no me sale.\" Me lo dijeron contadoras, ingenieras, médicas, managers. Mujeres con veinte años de carrera.\n\nSu problema no aparecía en un examen. Aparecía el martes a las nueve, con alguien esperando que hablaran.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"A cámara: \"Podría enseñar inglés general. Elegí no hacerlo.\" Link al reel.","h2":"¿Cuántas veces pensaste 'yo sé lo que quiero decir, pero no me sale'?","dia":"Miércoles","num":30,"tipoNom":"Diferenciación","fmtNom":"Reel a cámara","tpl":{"nombre":"martes DIFERENCIACION","url":"https://www.canva.com/design?create=true&template=EAHKB4Xyhuc"},"micro":   ['Hook = escena concreta','No una frase que serviría para cualquier nicho.'],

  ['La solución sale del producto','Se nombra AT WORK o la herramienta que resuelve eso.'],
  ['Una sola llamada','Y es una invitación al espacio, no una reflexión bonita.'],

];
const COLOR = {concientizacion:'var(--t-con)',diferenciacion:'var(--t-dif)',transformacion:'var(--t-tra)',filtro:'var(--t-fil)'};

/* El contexto que viaja con cada pedido, para que cualquier chat pueda
   responder con el criterio de Nadia sin tener el repo delante. */
const CRITERIO = `Contexto: Instagram de Breaking Barriers at Work (@ysi_speakenglish), mentoría de comunicación profesional en inglés para directoras y managers latinoamericanas. Se escribe en tú, nunca en vos.

Estructura obligatoria: HOOK → DESARROLLO → GIRO → AHA → CTA.

Reglas, todas obligatorias:
1. El hook es una escena concreta de trabajo. Si serviría igual para un post de fitness o de finanzas, está genérico y hay que reescribirlo.
2. Un solo micro-ángulo por pieza. No mezclar lo emocional, lo estratégico y el acompañamiento en la misma.
3. Que se vea el método concreto, no la mentalidad abstracta.
4. La solución sale del producto: nombrar AT WORK y la herramienta que resuelve eso (Role Play Method, Color Method, Narrative Flow, Shadowing, STAR, PREP).
5. Una sola llamada a la acción, y es una invitación a escribir por DM.
6. Nada de "empoderamiento" ni motivación genérica. No prometer ausencia de errores, fluidez nativa, ni un ascenso.`;

const PEDIDOS = [
  ['hook','Cambiame el hook','Dame 5 hooks alternativos para este posteo. Cada uno tiene que ser una escena concreta de trabajo, distinta de la actual. Después decime cuál elegirías y por qué.'],
  ['corto','Hacelo más corto','Acortá este posteo a la mitad sin perder el micro-ángulo ni el anclaje al método. Mantené la estructura HOOK → DESARROLLO → GIRO → AHA → CTA.'],
  ['filtro','Revisá si pasa el filtro','Revisá este posteo contra las seis reglas, una por una. Decime cuáles pasa y cuáles no, y reescribí solo las partes que fallan.'],
  ['nuevo','Escribime otro sobre lo mismo','Escribime un posteo nuevo, distinto de este, sobre el mismo micro-ángulo pero entrando por otro lado.'],
  ['libre','Otra cosa…','']
];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const hoyKey = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };

let estado = {};
try { estado = JSON.parse(localStorage.getItem('bbatw_contentos_sep') || '{}'); } catch(e){}
function guardar(){ try{ localStorage.setItem('bbatw_contentos_sep', JSON.stringify(estado)); }catch(e){} }
const pub = f => estado[f] === 1;

let tab = 'hoy';
let mesIdx = 0;
const CLAVES = [...new Set(POSTS.map(p=>p.f.slice(0,7)))].sort();
const VACIA = CLAVES.length === 0;
const delMes = k => POSTS.filter(p=>p.f.slice(0,7)===k);
function mesDeHoy(){
  if(VACIA) return 0;
  const hk = hoyKey().slice(0,7);
  const i = CLAVES.indexOf(hk);
  if(i>-1) return i;
  const j = CLAVES.findIndex(k=>k>=hk);
  return j>-1 ? j : CLAVES.length-1;
}
mesIdx = mesDeHoy();
