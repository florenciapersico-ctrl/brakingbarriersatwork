<style>
*,*::before,*::after{box-sizing:border-box}

:root[data-theme="dark"]{

}
body{margin:0;background:var(--cream);color:var(--ink);
  font-family:'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased;padding-bottom:82px}
h1,h2,h3,.serif{font-family:'Crimson Pro',Georgia,serif;line-height:1.16;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.wrap{max-width:620px;margin:0 auto;padding:0 18px}

header{position:sticky;top:0;z-index:30;background:var(--cream);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:16px 0 12px}
.hd .sub{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.hd h1{font-size:24px;font-weight:700;margin-top:2px}
.count{font-size:11.5px;color:var(--ink-3);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.strip{display:flex;gap:3px;padding-bottom:11px}
.strip i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.strip i.done{background:var(--olive)}
.strip i.hoy{background:var(--brown)}

.hero{padding:24px 0 4px}
.hero .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.hero h2{font-size:30px;font-weight:700;margin-top:5px;letter-spacing:-.015em}
.hero .d{font-size:13.5px;color:var(--ink-3);margin-top:4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:17px;
  margin-bottom:13px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.card.pub{opacity:.55}
.tag{display:flex;align-items:flex-start;gap:7px;font-size:10px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--tc);line-height:1.5}
.tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;margin-top:5px}
.meta{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.card h3{font-size:20px;font-weight:700;margin:9px 0 7px;letter-spacing:-.01em}
.card .lede{font-size:14px;color:var(--ink-2);line-height:1.6}
.foot{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;
  border:1px solid var(--line);color:var(--ink-2);background:var(--cream)}
.chip.solid{background:var(--brown);color:#FFF8E7;border-color:var(--brown)}
.chip.olive{background:var(--olive);color:#FFF8E7;border-color:var(--olive)}
.chip:active{transform:scale(.97)}
.chip:focus-visible{outline:2px solid var(--brown);outline-offset:2px}

.lbl{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  display:flex;align-items:center;gap:9px;margin:26px 0 11px}
.lbl::after{content:'';flex:1;height:1px;background:var(--line)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0 4px}
.cal .dow{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);text-align:center;padding-bottom:4px}
.cal .c{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;font-size:13px;color:var(--ink-3);border:1px solid transparent}
.cal .c.has{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600;cursor:pointer}
.cal .c.hoy{border-color:var(--brown);border-width:2px}
.cal .c .p{width:6px;height:6px;border-radius:50%;background:var(--tc)}
.cal .c.pub{opacity:.5}

.scrim{position:fixed;inset:0;background:rgba(44,31,14,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--cream);
  border-radius:20px 20px 0 0;max-height:93vh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .28s cubic-bezier(.32,.72,0,1);box-shadow:0 -8px 40px rgba(44,31,14,.3)}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 0;flex:none}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 18px 34px}
.close{position:absolute;right:12px;top:11px;width:32px;height:32px;border-radius:50%;
  background:var(--cream-2);display:grid;place-items:center;font-size:14px;color:var(--ink-2);z-index:2}

.copybox{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px;
  font-size:15px;line-height:1.75;white-space:pre-wrap;color:var(--ink)}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px;
  display:flex;gap:12px;align-items:flex-start;margin-bottom:7px}
.slide .n{flex:none;width:23px;height:23px;border-radius:6px;background:var(--cream-2);color:var(--ink-2);
  font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:2px;font-variant-numeric:tabular-nums}
.slide b{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.slide .x{font-size:14.5px;line-height:1.6;white-space:pre-wrap}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}
.acts .chip{flex:1;min-width:140px;text-align:center;padding:12px 10px}
.kv{display:flex;gap:11px;font-size:13.5px;padding:9px 0;border-bottom:1px dashed var(--line);line-height:1.55}
.kv:last-child{border:0}
.kv b{flex:none;width:82px;color:var(--ink-3);font-weight:600;font-size:12px;letter-spacing:.02em}
.chk{display:flex;gap:10px;font-size:13.5px;padding:8px 0;color:var(--ink-2);line-height:1.5}
.chk s{flex:none;color:var(--olive);font-weight:700;text-decoration:none}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.6;margin-top:16px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--cream);
  border-top:1px solid var(--line);display:flex}
nav button{flex:1;padding:12px 4px 14px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--ink-3);text-transform:uppercase}
nav button.on{color:var(--brown)}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:94px;transform:translate(-50%,12px);background:var(--ink);color:var(--cream);
  font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:999px;z-index:80;opacity:0;
  pointer-events:none;transition:all .24s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.mnav{display:flex;align-items:center;gap:4px}
.mnav button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  color:var(--ink-3);font-size:19px;line-height:1}
.mnav button:disabled{opacity:.25}
.mnav button:not(:disabled):active{background:var(--cream-2)}
.banner{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brown);
  border-radius:13px;padding:15px 16px;margin:18px 0 4px;box-shadow:var(--shadow)}
.banner h4{font-family:'Crimson Pro',Georgia,serif;font-size:18px;font-weight:700;margin:0 0 6px}
.banner p{font-size:14px;color:var(--ink-2);margin:0;line-height:1.6}
.banner ol{margin:9px 0 0;padding-left:19px;font-size:14px;color:var(--ink-2);line-height:1.75}
.banner .x{position:absolute;right:10px;top:8px;font-size:13px;color:var(--ink-3);padding:6px}
.banner{position:relative}
.pedir{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.pedir button{text-align:left;border:1px solid var(--line);border-radius:11px;padding:12px 14px;
  background:var(--surface);font-size:14px;font-weight:600;color:var(--ink);display:flex;
  align-items:center;justify-content:space-between;gap:10px}
.pedir button:active{background:var(--cream-2)}
.pedir button span{font-size:12.5px;font-weight:400;color:var(--ink-3);flex:none}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
'use strict';
const POSTS = [{"f":"2026-08-31","tipo":"concientizacion","sub":"Verdadero problema","fmt":"carrusel","eje":"Executive Communication","mecanismo":"Carga doble: pensar la estructura y producir el idioma a la vez","cree":"\"Me trabé, entonces me falta inglés.\"","diagnostico":"Intentaste pensar el proceso y construir el inglés al mismo tiempo. Ejecutar algo todos los días no es lo mismo que poder explicarlo: nunca tuviste que ponerlo en orden para alguien que no lo conoce.","lleva":"Un proceso real de tu trabajo → organizarlo → detectar el lenguaje que falta → volver a producirlo sin memorizar un texto.","roadmap":"M2 · Organize and Prioritize Your Message + Workplace Guide: Explaining a Process Clearly","origen":"Clase real del 28/7","b":[["SLIDE 1","Te pidieron que explicaras un proceso que conoces de memoria. Y te trabaste. Saliste pensando que fue tu inglés."],["SLIDE 2","Es la conclusión más lógica. Estabas hablando en inglés y ahí se rompió.\n\nPero fíjate qué estabas haciendo en ese mismo segundo."],["SLIDE 3","Decidir por dónde empezar.\nOrdenar los pasos.\nAcordarte de qué depende de qué.\nY construir las frases en inglés.\n\nTodo junto. Con alguien esperando."],["SLIDE 4","Ese proceso lo ejecutas todas las semanas. Pero ejecutar no es lo mismo que explicar.\n\nCuando lo haces, tu cabeza va saltando entre pasos, corrigiendo sobre la marcha, sin necesidad de que nada quede ordenado por fuera de ti."],["SLIDE 5","Explicarlo te obliga a lo contrario: dónde empieza, qué pasa después, qué depende de qué, qué cambia si algo falla.\n\nEso es una estructura. Y probablemente nunca la armaste, ni en español."],["SLIDE 6","Entonces llega la reunión y tienes dos trabajos a la vez: construir la estructura y producir el idioma.\n\nCuando una de las dos no está resuelta de antes, la otra se cae. Y como estabas hablando en inglés, le echas la culpa al inglés."],["SLIDE 7","La prueba es simple. Si te pidieran explicar ese mismo proceso en español, ahora, a alguien que no sabe nada: ¿te saldría ordenado a la primera?\n\nMuchas veces la respuesta también es no."],["SLIDE 8 · CTA","En AT WORK no practicamos \"explicar procesos\" en general. Agarramos uno real de tu trabajo, lo ordenamos, detectamos qué lenguaje te falta, y lo vuelves a producir hasta que salga claro sin memorizar nada.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Te pidieron que explicaras un proceso que conoces de memoria. Y te trabaste. Saliste pensando que fue tu inglés.\n\nEstabas haciendo dos trabajos a la vez: armar la estructura y producir el idioma. Cuando uno de los dos no está resuelto de antes, el otro se cae.\n\nEjecutar un proceso todos los días no es lo mismo que poder explicarlo.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"¿Te trabaste explicando algo que haces todas las semanas?\" Invita a deslizar.","h2":"Prueba esto: explica ese proceso en español, en voz alta, a alguien que no sepa nada. ¿Sale ordenado?","dia":"Lunes","num":31,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Intentaste pensar el proceso y construir el inglés al mismo tiempo. Ejecutar algo todos los días no es lo mismo que poder explicarlo: nunca tuviste que ponerlo en orden para alguien que no lo conoce.","ancla":"M2 · Organize and Prioritize Your Message + Workplace Guide: Explaining a Process Clearly  ·  Clase real del 28/7"},{"f":"2026-09-02","tipo":"diferenciacion","sub":"Opinión picante","fmt":"reel","eje":"Método","mecanismo":"Criterio de selección: qué merece ocupar tu tiempo","cree":"\"Un buen programa es uno que cubre mucho.\"","diagnostico":"Un programa lleno de temas no te da más: te da más para no terminar. Y te instala la sensación de que siempre te falta algo.","lleva":"Un tema entra solo si se repite entre alumnas distintas, sirve en varios roles, y ayuda a comunicar bajo presión. Si le pasa a una sola, va a su sesión.","roadmap":"Roadmap · Regla: SE GRABA / SE INTEGRA / VA AL 1:1","origen":"Roadmap AT WORK","b":[["HOOK · 0-3 s","Tengo una regla para decidir qué entra a mi programa, y deja afuera casi todo."],["REHOOK · 4-7 s","Y te la cuento porque probablemente ya pagaste por lo contrario."],["EL PROBLEMA DE ELLA","Listas de phrasal verbs de negocios. Vocabulario de finanzas que no es tu área. Expresiones para situaciones que no tienes.\n\nNo estaba mal en sí. El problema es que te ocupó el tiempo de lo que sí ibas a usar. Y te dejó una sensación fea: que siempre te falta algo."],["EL GIRO","Un programa lleno de temas no te da más. Te da más para no terminar."],["MI CRITERIO","Por eso un tema entra solo si cumple tres cosas:\n\nse repite entre alumnas distintas,\nsirve en varios roles y no en uno solo,\ny te ayuda a comunicar mejor bajo presión.\n\nSi le pasa a una sola, no va al programa: va a su sesión."],["AHA","No necesitas un programa que cubra todo. Necesitas uno que haya decidido qué dejar afuera."],["CIERRE · texto en pantalla","Completo, sí. Enciclopédico, no.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Tengo una regla para decidir qué entra a mi programa, y deja afuera casi todo.\n\nTe la cuento porque probablemente ya pagaste por lo contrario: listas de vocabulario que nunca usaste, temas de áreas que no son la tuya, expresiones para situaciones que no tienes.\n\nUn programa lleno de temas no te da más. Te da más para no terminar.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"A cámara: \"¿Cuánto de lo que estudiaste en inglés usaste de verdad?\" Link al reel.","h2":"Cuéntame un tema que estudiaste y nunca usaste. Los leo todos.","dia":"Miércoles","num":2,"tipoNom":"Diferenciación","fmtNom":"Reel a cámara","tpl":{"nombre":"martes DIFERENCIACION","url":"https://www.canva.com/design?create=true&template=EAHKB4Xyhuc"},"micro":"Un programa lleno de temas no te da más: te da más para no terminar. Y te instala la sensación de que siempre te falta algo.","ancla":"Roadmap · Regla: SE GRABA / SE INTEGRA / VA AL 1:1  ·  Roadmap AT WORK"},{"f":"2026-09-04","tipo":"concientizacion","sub":"Error invisible","fmt":"carrusel","eje":"Visibility Gap","mecanismo":"Conocimiento sin automatización: la palabra correcta en la categoría equivocada","cree":"\"Si sueno poco profesional es porque me falta vocabulario.\"","diagnostico":"Conoces la palabra. Lo que falla es la forma de la palabra: dices el verbo donde el registro pedía el sustantivo. Y nadie te lo corrige porque igual se entiende.","lleva":"Ver el patrón una vez → entrenar las familias de palabras que se repiten en tu área → producirlas otra vez hasta que salgan primero.","roadmap":"M3 · Nominalization & Word Families for Professional English","origen":"Clase real del 28/7 · patrón detectado en dos alumnas distintas","b":[["SLIDE 1","Hay un error que cometes en cada reunión, que nadie te va a corregir nunca, y que te hace sonar menos profesional de lo que eres."],["SLIDE 2","Es este: dices \"we need to decide this\" donde el registro pedía \"we need a decision on this\".\n\nDices \"don't translation\" cuando querías decir \"don't translate\".\n\nLa raíz está bien. La categoría de la palabra, no."],["SLIDE 3","Y nadie te lo marca porque se entiende igual. Tu interlocutor completa el sentido y sigue.\n\nPor eso puede repetirse durante años sin que nadie diga nada."],["SLIDE 4","No es falta de vocabulario. Conoces la palabra. Podrías escribirla bien si te dieran diez segundos."],["SLIDE 5","Pero el inglés corporativo se apoya justo ahí.\n\n\"Decide\" es una acción que alguien hace.\n\"Decision\" es algo que se aprueba, se revisa, se documenta y se presenta.\n\nUna versión suena a alguien ejecutando. La otra, a alguien dirigiendo."],["SLIDE 6","Y ahí está el costo invisible: no suena mal. Suena junior.\n\nEs una diferencia que no aparece en ninguna corrección y sí aparece en cómo te tratan en la mesa."],["SLIDE 7","Esto no se arregla estudiando más vocabulario. Es la misma palabra que ya tienes, en otra forma.\n\nSe arregla viendo el patrón una vez y entrenando las familias que más se repiten en tu área, sobre frases que realmente usas."],["SLIDE 8 · CTA","Lo veo tan seguido entre alumnas distintas que dejó de ser un caso puntual: es uno de los sistemas que grabé aparte, porque aparece siempre.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"Hay un error que cometes en cada reunión, que nadie te va a corregir nunca, y que te hace sonar menos profesional de lo que eres.\n\nDices \"we need to decide this\" donde el registro pedía \"we need a decision on this\". La raíz está bien; la categoría de la palabra, no.\n\nNadie te lo marca porque se entiende igual. Y no suena mal: suena junior.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"Hay un error que nadie te corrige porque igual se entiende.\" Invita a deslizar.","h2":"\"We need to decide this\" vs \"we need a decision on this\". Misma idea, otra persona del otro lado.","dia":"Viernes","num":4,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Conoces la palabra. Lo que falla es la forma de la palabra: dices el verbo donde el registro pedía el sustantivo. Y nadie te lo corrige porque igual se entiende.","ancla":"M3 · Nominalization & Word Families for Professional English  ·  Clase real del 28/7 · patrón detectado en dos alumnas distintas"},{"f":"2026-09-05","tipo":"concientizacion","sub":"Metodología","fmt":"carrusel","eje":"Executive Introduction","mecanismo":"La primera impresión como filtro de todo lo que viene después","cree":"\"Presentarme es dar mis datos. Lo importante viene después.\"","diagnostico":"Los primeros treinta segundos no informan: instalan la posición desde la que te van a escuchar el resto del proyecto. Todo lo que digas después pasa por ese filtro.","lleva":"Definir qué quieres que esa sala recuerde → armar las tres partes → entrenarlas con role play hasta que salgan sin pensarlas.","roadmap":"M2 · Workplace Practice Library · Introducing Yourself to a New Team","origen":"Workplace Guide","b":[["SLIDE 1","\"So, tell us a bit about yourself.\"\n\nY ahí dices tu nombre, tu cargo, hace cuánto estás en la empresa. Y se termina."],["SLIDE 2","No estuvo mal. Es información correcta y es lo que te preguntaron.\n\nEl problema es que es la misma respuesta que daría cualquiera de tu equipo cambiando el nombre."],["SLIDE 3","Y esos treinta segundos hacen algo que casi nadie mide: fijan desde qué lugar te van a escuchar durante el resto del proyecto.\n\nTodo lo que digas después pasa por ese filtro."],["SLIDE 4","Si te presentaste como la persona que ocupa un cargo, tus intervenciones se van a leer como reportes.\n\nSi te presentaste como la persona que resuelve un tipo de problema, las mismas intervenciones se leen como criterio."],["SLIDE 5","Misma información. Distinto lugar.\n\nY en un equipo nuevo, donde nadie te vio trabajar todavía, eso es literalmente todo lo que tienen de ti."],["SLIDE 6","Una introducción que funciona tiene tres partes:\n\nqué resuelves, no qué puesto ocupas,\nqué estás haciendo ahora que le importa a esta gente,\ny qué te interesa de estar en este proyecto."],["SLIDE 7","Fíjate que ninguna de las tres es tu cargo. El cargo dice dónde estás sentada. No dice qué pasa cuando estás en el proyecto."],["SLIDE 8 · CTA","Y esto no se improvisa cada vez. Se define una vez y se entrena, con role play, hasta que salga sin pensarla. En AT WORK tiene su propia guía de práctica.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"\"So, tell us a bit about yourself.\" Y ahí dices tu nombre, tu cargo, hace cuánto estás en la empresa. Y se termina.\n\nEs correcto. Y es la misma respuesta que daría cualquiera de tu equipo cambiando el nombre.\n\nEsos treinta segundos fijan desde qué lugar te van a escuchar el resto del proyecto. Si te presentaste como un cargo, tus intervenciones se leen como reportes. Si te presentaste como alguien que resuelve algo, se leen como criterio.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"Texto sobre fondo: \"¿Qué respondés cuando te dicen 'tell us about yourself'?\" Invita a deslizar.","h2":"Cuéntame qué dices hoy y te digo qué le falta.","dia":"Sábado","num":5,"tipoNom":"Concientización","fmtNom":"Carrusel","tpl":{"nombre":"CONCIENTIZACION 1 · lunes","url":"https://www.canva.com/design?create=true&template=EAHLS8B0Mzw"},"micro":"Los primeros treinta segundos no informan: instalan la posición desde la que te van a escuchar el resto del proyecto. Todo lo que digas después pasa por ese filtro.","ancla":"M2 · Workplace Practice Library · Introducing Yourself to a New Team  ·  Workplace Guide"},{"f":"2026-09-06","tipo":"transformacion","sub":"Mini transformación","fmt":"reel","eje":"Questions Under Pressure","mecanismo":"Progreso sin aprendizaje nuevo","cree":"\"Para sonar mejor necesito saber más inglés.\"","diagnostico":"Entre una versión y la otra no aprendió veinte palabras nuevas. Hubo claridad del mensaje, el lenguaje justo que faltaba, feedback y retry.","lleva":"El progreso no siempre es aprender más inglés. A veces es usar mejor el que ya tienes.","roadmap":"M1 · Role Play Method + M2 · Organize and Prioritize Your Message","origen":"Clase real del 28/7","b":[["HOOK · 0-3 s","En una misma clase le hice practicar la misma conversación dos veces. La diferencia entre una y otra no fue el inglés."],["REHOOK · 4-7 s","Y quiero contarte qué pasó en el medio, porque explica bastante bien por qué te bloqueas."],["LA PRIMERA VEZ","Tenía que presentarse ante alguien de otra empresa y explicar a qué se dedica. Algo que hace todo el tiempo.\n\nSe perdió. Metió detalles que no hacían falta, dudó, se corrigió dos veces y no llegó al punto. No por nervios: estaba organizando mientras hablaba."],["EL MEDIO","No le enseñé veinte palabras nuevas.\n\nOrdenamos qué quería comunicar. Le di el lenguaje puntual que le faltaba, que eran tres o cuatro cosas. Le devolví qué había pasado. Y volvimos a hacerlo."],["LA SEGUNDA VEZ","Misma conversación. Más clara, más directa, más segura.\n\nVeinte minutos después."],["EL GIRO","En veinte minutos nadie aprende inglés nuevo.\n\nEl progreso no siempre es aprender más. A veces es usar mejor lo que ya tienes."],["CIERRE · texto en pantalla","Y eso se entrena mucho más rápido de lo que crees.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso."]],"caption":"En una misma clase le hice practicar la misma conversación dos veces. La diferencia entre una y otra no fue el inglés.\n\nEn el medio no hubo veinte palabras nuevas. Hubo claridad del mensaje, el lenguaje justo que faltaba, feedback y volver a hacerlo.\n\nEl progreso no siempre es aprender más inglés. A veces es usar mejor el que ya tienes.\n\nEscríbeme AT WORK por DM y te cuento cómo lo trabajaríamos en tu caso.","h1":"A cámara: \"La misma conversación, dos veces, con veinte minutos de diferencia.\" Link al reel.","h2":"¿Qué conversación tuya volverías a hacer si pudieras?","dia":"Domingo","num":6,"tipoNom":"Transformación y Deseo","fmtNom":"Reel a cámara","tpl":{"nombre":"jueves TRANSFORMACION Y DESEO","url":"https://www.canva.com/design?create=true&template=EAHKB4SjwII"},"micro":"Entre una versión y la otra no aprendió veinte palabras nuevas. Hubo claridad del mensaje, el lenguaje justo que faltaba, feedback y retry.","ancla":"M1 · Role Play Method + M2 · Organize and Prioritize Your Message  ·  Clase real del 28/7"}];

/* Los seis filtros de Nadia. Se muestran en cada pieza para poder
   verificarlos antes de publicar, no como decoración. */
const FILTROS = [
  ['Hook = escena concreta','No una frase que serviría para cualquier nicho.'],
  ['Un solo micro-ángulo','Si mezclás emocional + estratégico + acompañamiento, suena repetitivo.'],
  ['Se ve el método','No queda todo en mentalidad: aparece el framework concreto.'],
  ['La solución sale del producto','Se nombra AT WORK o la herramienta que resuelve eso.'],
  ['Una sola llamada','Y es una invitación al espacio, no una reflexión bonita.'],
  ['Suena a Flor','No a plantilla de LinkedIn.']
];
const COLOR = {concientizacion:'var(--t-con)',diferenciacion:'var(--t-dif)',transformacion:'var(--t-tra)',filtro:'var(--t-fil)'};
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

/* El contexto que viaja con cada pedido, para que cualquier chat pueda
   responder con el criterio de Nadia sin tener el repo delante. */
const CRITERIO = `Contexto: Instagram de Breaking Barriers at Work (@ysi_speakenglish), mentoría de comunicación profesional en inglés para directoras y managers latinoamericanas. Se escribe en tú, nunca en vos.

Estructura obligatoria: HOOK → DESARROLLO → GIRO → AHA → CTA.

Reglas, todas obligatorias:
1. El hook es una escena concreta de trabajo. Si serviría igual para un post de fitness o de finanzas, está genérico y hay que reescribirlo.
2. Un solo micro-ángulo por pieza. No mezclar lo emocional, lo estratégico y el acompañamiento en la misma.
3. Que se vea el método concreto, no la mentalidad abstracta.
4. La solución sale del producto: nombrar AT WORK y la herramienta que resuelve eso (Role Play Method, Color Method, Narrative Flow, Shadowing, STAR, PREP).
5. Una sola llamada a la acción, y es una invitación a escribir por DM.
6. Nada de "empoderamiento" ni motivación genérica. No prometer ausencia de errores, fluidez nativa, ni un ascenso.`;

const PEDIDOS = [
  ['hook','Cambiame el hook','Dame 5 hooks alternativos para este posteo. Cada uno tiene que ser una escena concreta de trabajo, distinta de la actual. Después decime cuál elegirías y por qué.'],
  ['corto','Hacelo más corto','Acortá este posteo a la mitad sin perder el micro-ángulo ni el anclaje al método. Mantené la estructura HOOK → DESARROLLO → GIRO → AHA → CTA.'],
  ['filtro','Revisá si pasa el filtro','Revisá este posteo contra las seis reglas, una por una. Decime cuáles pasa y cuáles no, y reescribí solo las partes que fallan.'],
  ['nuevo','Escribime otro sobre lo mismo','Escribime un posteo nuevo, distinto de este, sobre el mismo micro-ángulo pero entrando por otro lado.'],
  ['libre','Otra cosa…','']
];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const hoyKey = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };

let estado = {};
try { estado = JSON.parse(localStorage.getItem('bbatw_contentos_sep') || '{}'); } catch(e){}
function guardar(){ try{ localStorage.setItem('bbatw_contentos_sep', JSON.stringify(estado)); }catch(e){} }
const pub = f => estado[f] === 1;

let tab = 'hoy';
let mesIdx = 0;
const CLAVES = [...new Set(POSTS.map(p=>p.f.slice(0,7)))].sort();
const VACIA = CLAVES.length === 0;
const delMes = k => POSTS.filter(p=>p.f.slice(0,7)===k);
function mesDeHoy(){
  if(VACIA) return 0;
  const hk = hoyKey().slice(0,7);
  const i = CLAVES.indexOf(hk);
  if(i>-1) return i;
  const j = CLAVES.findIndex(k=>k>=hk);
  return j>-1 ? j : CLAVES.length-1;
}
mesIdx = mesDeHoy();

/* Mejor vacía y honesta que llena de contenido que no se puede publicar. */
function pantallaVacia(){
  return `<div class="hero"><div class="k">Sin contenido cargado</div>
    <h2>Todavía no hay nada para publicar acá</h2>
    <div class="d">La app funciona. Falta el contenido.</div></div>
  <div class="card" style="--tc:var(--brown)">
    <div class="tag"><span class="dot"></span><span>Qué pasó</span></div>
    <h3>Se quitó el contenido anterior</h3>
    <p class="lede">Venía de un calendario de agosto que ya se había publicado, y además hablaba de cohortes y de cupos que abren en octubre. AT WORK es 1:1, cinco meses, hasta 16 alumnas activas. No hay cohortes. Publicar eso habría sido decir algo que no es cierto.</p>
  </div>
  <div class="card" style="--tc:var(--olive)">
    <div class="tag"><span class="dot"></span><span>Qué falta</span></div>
    <h3>Tu semana del 24 al 29</h3>
    <p class="lede">Es el único contenido terminado que hay, y está en un archivo .xlsm que las herramientas no pueden abrir. Con que lo abras una vez como Hoja de cálculo de Google, entra acá en minutos.</p>
  </div>
  <p class="note">Todo lo demás —de esta semana en adelante— se escribe de cero, con el criterio de Nadia, desde el roadmap y los transcripts de tus clases.</p>`;
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1900); }
async function copiar(txt,msg){
  try{ await navigator.clipboard.writeText(txt); toast(msg); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(msg); }catch(_){ toast('No se pudo copiar'); }
    ta.remove();
  }
}

function tarjeta(p, conFecha){
  const y = pub(p.f);
  return `<article class="card${y?' pub':''}" style="--tc:${COLOR[p.tipo]}">
    <div class="tag"><span class="dot"></span><span>${esc(p.tipoNom)} · ${esc(p.sub)}</span></div>
    <div class="meta">${conFecha?esc(p.dia)+' '+p.num+' · ':''}${esc(p.fmtNom)}${p.eje?' · '+esc(p.eje):''}${y?' · publicado':''}</div>
    <h3>${esc(p.b[0][1])}</h3>
    <p class="lede">${esc(p.diagnostico||p.micro||'')}</p>
    <div class="foot">
      <button class="chip solid" data-a="ver" data-f="${p.f}">Ver el posteo</button>
      <button class="chip" data-a="copy" data-f="${p.f}">Copiar texto</button>
      ${y?`<button class="chip" data-a="no" data-f="${p.f}">Desmarcar</button>`
         :`<button class="chip olive" data-a="si" data-f="${p.f}">Publicado</button>`}
    </div>
  </article>`;
}

function pintarHoy(){
  const hk = hoyKey();
  const hoy = POSTS.find(p=>p.f===hk && !pub(p.f));
  /* Si hoy no toca, el protagonista pasa a ser el siguiente que hay que
     preparar. Una app que dice "hoy nada" todos los días no sirve. */
  const foco = hoy || POSTS.find(p=>p.f>=hk && !pub(p.f)) || POSTS.filter(p=>!pub(p.f)).pop();
  const atras = POSTS.filter(p=>p.f<hk && !pub(p.f) && p!==foco).slice(-2);
  const prox = POSTS.filter(p=>p.f>hk && !pub(p.f) && p!==foco).slice(0,3);
  if(VACIA){ $('#vHoy').innerHTML = instalar() + pantallaVacia(); return; }
  let h = instalar();
  if(foco){
    const esHoy = foco.f===hk, pasado = foco.f<hk;
    h += `<div class="hero"><div class="k">${esHoy?'Hoy toca':(pasado?'Te quedó pendiente':'Lo próximo')}</div>
      <h2>${esc(foco.tipoNom)}</h2>
      <div class="d">${esc(foco.dia)} ${foco.num} de ${MESES[+foco.f.slice(5,7)-1].toLowerCase()} · ${esc(foco.fmtNom)}</div></div>`;
    h += tarjeta(foco,false);
  } else {
    h += `<div class="hero"><div class="k">Todo publicado</div><h2>No queda nada pendiente</h2>
      <div class="d">El mes que viene se escribe solo el día 25.</div></div>`;
  }
  if(atras.length){ h += `<div class="lbl">Quedó sin publicar</div>` + atras.map(p=>tarjeta(p,true)).join(''); }
  if(prox.length){ h += `<div class="lbl">Lo que viene</div>` + prox.map(p=>tarjeta(p,true)).join(''); }
  $('#vHoy').innerHTML = h;
}

/* Instrucciones para dejarla como ícono. Solo aparece si todavía se está
   viendo dentro del navegador. */
function instalar(){
  let yaEsApp = false;
  try{ yaEsApp = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }catch(e){}
  if(yaEsApp || estado._inst) return '';
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent||'');
  const pasos = ios
    ? ['Tocá el botón de compartir, abajo en el centro (el cuadradito con la flecha para arriba).',
       'Bajá en la lista hasta <b>Agregar a inicio</b>.',
       'Tocá <b>Agregar</b>, arriba a la derecha.']
    : ['Tocá los tres puntitos, arriba a la derecha.',
       'Elegí <b>Agregar a pantalla principal</b> o <b>Instalar aplicación</b>.',
       'Confirmá con <b>Instalar</b>.'];
  return `<div class="banner"><button class="x" data-a="cerrarInst" data-f="_">✕</button>
    <h4>Dejala como ícono en el celular</h4>
    <p>Tres pasos y queda como cualquier otra app, sin la barra del navegador.</p>
    <ol>${pasos.map(x=>'<li>'+x+'</li>').join('')}</ol></div>`;
}

function pintarMes(){
  if(VACIA){ $('#vMes').innerHTML = pantallaVacia(); return; }
  const hk = hoyKey(), clave = CLAVES[mesIdx], porF = {};
  const y = +clave.slice(0,4), m = +clave.slice(5,7)-1;
  delMes(clave).forEach(p=>porF[p.f]=p);
  const arranque=(new Date(y,m,1).getDay()+6)%7, dias=new Date(y,m+1,0).getDate();
  let h = '<div class="cal">'+['L','M','M','J','V','S','D'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<arranque;i++) h+='<div class="c"></div>';
  for(let d=1;d<=dias;d++){
    const f=clave+'-'+pad(d), p=porF[f];
    const cls=['c']; if(p)cls.push('has'); if(f===hk)cls.push('hoy'); if(pub(f))cls.push('pub');
    h += `<div class="${cls.join(' ')}" ${p?`style="--tc:${COLOR[p.tipo]}" data-a="ver" data-f="${f}"`:''}>
      <span>${d}</span>${p?'<span class="p"></span>':''}</div>`;
  }
  h += '</div>';
  const lote = delMes(clave);
  h += `<div class="lbl">${lote.length} posteos · ${lote.filter(x=>pub(x.f)).length} publicados</div>`
     + lote.map(p=>tarjeta(p,true)).join('');
  h += `<p class="note">Todo el texto está escrito y revisado contra los seis filtros de Nadia. Editá lo que quieras antes de publicar: es un borrador con criterio, no un guion cerrado.</p>`;
  $('#vMes').innerHTML = h;
}

function pintar(){
  if(VACIA){
    $('#hT').textContent = 'Content OS';
    $('#hC').textContent = '';
    $('#mPrev').disabled = true; $('#mNext').disabled = true;
    $('#strip').innerHTML = '';
    $('#vHoy').classList.toggle('hide', tab!=='hoy');
    $('#vMes').classList.toggle('hide', tab!=='mes');
    if(tab==='hoy') pintarHoy(); else pintarMes();
    return;
  }
  const clave = CLAVES[mesIdx], lote = delMes(clave), hk = hoyKey();
  $('#hT').textContent = MESES[+clave.slice(5,7)-1];
  $('#hC').textContent = lote.filter(p=>pub(p.f)).length+' de '+lote.length;
  $('#mPrev').disabled = mesIdx===0;
  $('#mNext').disabled = mesIdx===CLAVES.length-1;
  $('#strip').innerHTML = lote.map(p=>`<i class="${pub(p.f)?'done':(p.f===hk?'hoy':'')}"></i>`).join('');
  $('#vHoy').classList.toggle('hide', tab!=='hoy');
  $('#vMes').classList.toggle('hide', tab!=='mes');
  if(tab==='hoy') pintarHoy(); else pintarMes();
}

function pedido(p, texto){
  return texto + '\n\n' + CRITERIO
    + `\n\nDatos de la pieza:\nTipo: ${p.tipoNom} · Subtipo: ${p.sub} · Formato: ${p.fmtNom}\n`
    + `Escena: ${p.b[0][1].split('\n')[0]}\n`
    + `Ella cree: ${p.cree||'—'}\n`
    + `Diagnóstico (tiene que ir MÁS ALLÁ de lo que ella ya cree): ${p.diagnostico||'—'}\n`
    + `Hacia dónde lleva: ${p.lleva||'—'}\n`
    + `Mecanismo (cada pieza de la semana tiene uno distinto; no repetir): ${p.mecanismo||'—'}\n`
    + `Eje temático: ${p.eje||'—'}\n`
    + `Objetivo del mes: lista de espera para los cupos de octubre. CERO venta directa.\n`
    + `Anclaje al método que tiene que quedar visible: ${p.ancla}\n\n`
    + `El posteo actual:\n\n${p.caption}`;
}

function abrir(f){
  const p = POSTS.find(x=>x.f===f); if(!p) return;
  const y = pub(p.f);
  $('#sB').innerHTML = `
    <div class="tag" style="--tc:${COLOR[p.tipo]};color:${COLOR[p.tipo]}"><span class="dot"></span><span>${esc(p.tipoNom)} · ${esc(p.sub)}</span></div>
    <h2 class="serif" style="font-size:24px;font-weight:700;margin:8px 0 5px">${esc(p.b[0][1])}</h2>
    <div class="meta">${esc(p.dia)} ${p.num} de ${MESES[+p.f.slice(5,7)-1].toLowerCase()} · ${esc(p.fmtNom)}</div>

    <div class="lbl">Caption, listo para pegar</div>
    <div class="copybox">${esc(p.caption)}</div>
    <div class="acts">
      <button class="chip solid" data-a="copy" data-f="${p.f}">Copiar texto</button>
      ${y?`<button class="chip" data-a="no" data-f="${p.f}">Desmarcar</button>`
         :`<button class="chip olive" data-a="si" data-f="${p.f}">Marcar publicado</button>`}
    </div>

    <div class="lbl">${p.fmt==='reel'?'El guion, parte por parte':'El carrusel, lámina por lámina'}</div>
    ${p.b.map((b,i)=>`<div class="slide"><span class="n">${i+1}</span><div><b>${esc(b[0])}</b><div class="x">${esc(b[1])}</div></div></div>`).join('')}
    <div class="acts"><button class="chip" data-a="laminas" data-f="${p.f}">Copiar solo las láminas</button></div>

    ${(p.h1||p.h2)?`<div class="lbl">Historias</div>
      ${p.h1?`<div class="slide"><span class="n">1</span><div><b>El día de la publicación</b><div class="x">${esc(p.h1)}</div></div></div>`:''}
      ${p.h2?`<div class="slide"><span class="n">2</span><div><b>A las 24 horas</b><div class="x">${esc(p.h2)}</div></div></div>`:''}
      <div class="acts"><button class="chip" data-a="hist" data-f="${p.f}">Copiar las historias</button></div>`:''}
    <div class="acts">
      <button class="chip solid" data-a="canva" data-f="${p.f}">Abrir tu plantilla en Canva</button>
    </div>
    <p class="note">Se abre <b>${esc(p.tpl.nombre)}</b>, tu plantilla de Canva para este tipo de contenido. El texto lo pegás vos: Canva todavía no acepta que se lo llene automáticamente.</p>

    <div class="lbl">Los filtros de Nadia</div>
    ${FILTROS.map(f=>`<div class="chk"><s>✓</s><div><b>${esc(f[0])}</b> — ${esc(f[1])}</div></div>`).join('')}
    <p class="note">Revisalos antes de publicar. El que más se cae es el primero: si el hook sirve para un post de fitness o de finanzas, no es tuyo todavía.</p>

    <div class="lbl">El recorrido</div>
    <div class="kv"><b>Mecanismo</b><span>${esc(p.mecanismo||'—')}</span></div>
    <div class="kv"><b>Escena</b><span>${esc(p.b[0][1].split('\n')[0])}</span></div>
    <div class="kv"><b>Ella cree</b><span>${esc(p.cree||'—')}</span></div>
    <div class="kv"><b>Diagnóstico</b><span>${esc(p.diagnostico||'—')}</span></div>
    <div class="kv"><b>Lleva a</b><span>${esc(p.lleva||'—')}</span></div>

    <div class="lbl">Ficha</div>
    <div class="kv"><b>Eje</b><span>${esc(p.eje||'—')}</span></div>
    <div class="kv"><b>Roadmap</b><span>${esc(p.ancla)}</span></div>
    <div class="lbl">Pedirle un cambio</div>
    <div class="pedir">${PEDIDOS.map(x=>`<button data-a="ped" data-f="${p.f}" data-p="${x[0]}">${esc(x[1])}<span>abre el chat ›</span></button>`).join('')}</div>
    <p class="note">Se copia el pedido con todo el criterio adentro y se abre el chat. Solo tenés que pegarlo.</p>
  `;
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
  $('#sB').scrollTop = 0;
}
function cerrar(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]');
  if(el){
    const a = el.dataset.a;
    if(a==='cerrarInst'){ estado._inst=1; guardar(); pintar(); return; }
    const p = POSTS.find(x=>x.f===el.dataset.f); if(!p) return;
    if(a==='ver')   return abrir(p.f);
    if(a==='copy')  return copiar(p.caption,'Texto copiado');
    if(a==='laminas') return copiar(p.b.map((b,i)=>b[0]+'\n'+b[1]).join('\n\n'),'Láminas copiadas');
    if(a==='hist')    return copiar('HISTORIA 1 — el día de la publicación\n'+(p.h1||'')+'\n\nHISTORIA 2 — a las 24 horas\n'+(p.h2||''),'Historias copiadas');
    if(a==='ped'){
      const id = el.dataset.p, def = PEDIDOS.find(x=>x[0]===id);
      let texto = def[2];
      if(id==='libre'){
        texto = prompt('¿Qué querés pedirle sobre este posteo?', '');
        if(!texto || !texto.trim()) return;
      }
      copiar(pedido(p, texto), 'Pedido copiado — pegalo en el chat');
      setTimeout(()=>window.open('https://claude.ai/new','_blank','noopener'), 450);
      return;
    }
    if(a==='cerrarInst'){ estado._inst=1; guardar(); pintar(); return; }
    if(a==='canva'){ window.open(p.tpl.url,'_blank','noopener'); return; }
    if(a==='si'||a==='no'){
      if(a==='si') estado[p.f]=1; else delete estado[p.f];
      guardar(); pintar();
      if($('#sheet').classList.contains('on')) abrir(p.f);
      return toast(a==='si'?'Marcado como publicado':'Desmarcado');
    }
    return;
  }
  const tb = e.target.closest('nav button');
  if(tb){
    tab = tb.dataset.t;
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b===tb));
    window.scrollTo({top:0}); pintar();
  }
});
$('#scrim').addEventListener('click', cerrar);
$('#sX').addEventListener('click', cerrar);
$('#mPrev').addEventListener('click', ()=>{ if(mesIdx>0){ mesIdx--; window.scrollTo({top:0}); pintar(); } });
$('#mNext').addEventListener('click', ()=>{ if(mesIdx<CLAVES.length-1){ mesIdx++; window.scrollTo({top:0}); pintar(); } });
pintar();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
